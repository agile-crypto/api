  // Hash algorithm. Default: SHA-256.
  // PKCS#11: CK_RSA_PKCS_PSS_PARAMS.hashAlg (CKM_SHA256, CKM_SHA384, etc.)
  // Valid: SHA-256 (1), SHA-384 (2), SHA-512 (3)
  HashAlgorithm hash = 2 [(buf.validate.field).enum = {in: [0, 1, 2, 3]}];
  
  // Mask generation function. Default: MGF1.
