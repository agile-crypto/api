// EcdsaParams defines parameters for ECDSA signatures.
// CycloneDX pattern: ECDSA-{curve}-{hash}
// PKCS#11 Mechanisms: CKM_ECDSA, CKM_ECDSA_SHA256, CKM_ECDSA_SHA384, CKM_ECDSA_SHA512
// PKCS#11 Key Type: CKK_EC
// The curve implicitly determines key size: P-256→256, P-384→384, P-521→521
message EcdsaParams {
  // Elliptic curve to use. Required.
  // PKCS#11: CKA_EC_PARAMS (DER-encoded OID)
  // Implicitly determines key size bits.
  // Valid: P-256 (1), P-384 (2), P-521 (3), secp256k1 (20)
  EllipticCurve curve = 1 [(buf.validate.field).enum = {in: [1, 2, 3, 20]}];
  
  // Hash algorithm for signing.
  // PKCS#11: Determines mechanism (CKM_ECDSA_SHA256, CKM_ECDSA_SHA384, etc.)
  // Default: curve-appropriate hash (P-256→SHA-256, P-384→SHA-384, P-521→SHA-512)
  HashAlgorithm hash = 2;
  
  // Signature output format. Default: DER.
  // PKCS#11 produces raw r||s; DER encoding done at API layer
  SignatureFormat signature_format = 3;
  
  // Use deterministic signature generation (RFC 6979).
  // Recommended for security: prevents nonce-reuse attacks.
  // Note: Not all HSMs support deterministic ECDSA.
  bool deterministic = 4;
  
  // Cross-field validation: curve should have appropriate hash (warning-level)
  // P-256 → SHA-256 (1), P-384 → SHA-384 (2), P-521 → SHA-512 (3)
  option (buf.validate.message).cel = {
    id: "ecdsa_curve_hash_match"
    message: "hash algorithm should match curve security level: P-256→SHA-256, P-384→SHA-384, P-521→SHA-512"
    expression: "this.hash == 0 || (this.curve == 1 && this.hash == 1) || (this.curve == 2 && this.hash == 2) || (this.curve == 3 && this.hash == 3) || (this.curve == 20)"
  };
}

// Ed25519Params defines parameters for Ed25519 signatures.
