// CamelliaParams defines parameters for Camellia cipher (Japan/EU).
// CycloneDX pattern: Camellia-{keyLength}-{mode}
// PKCS#11 Mechanisms: CKM_CAMELLIA_ECB, CKM_CAMELLIA_CBC, CKM_CAMELLIA_CTR
// PKCS#11 Key Type: CKK_CAMELLIA
// PKCS#11 Reference Struct: CK_CAMELLIA_CTR_PARAMS, CK_CAMELLIA_CBC_ENCRYPT_DATA_PARAMS
// Standards: ISO/IEC 18033-3, RFC 3713
message CamelliaParams {
  // Key size in bits.
  // PKCS#11: CKA_VALUE_LEN = 16, 24, or 32 bytes
  uint32 key_size_bits = 1 [(buf.validate.field).uint32 = {in: [128, 192, 256]}];
  
  // Block cipher mode.
  // PKCS#11: CKM_CAMELLIA_ECB, CKM_CAMELLIA_CBC, CKM_CAMELLIA_CTR
  enum Mode {
    MODE_UNSPECIFIED = 0;
    ECB = 1;   // CKM_CAMELLIA_ECB
    CBC = 2;   // CKM_CAMELLIA_CBC
    CTR = 3;   // CKM_CAMELLIA_CTR
  }
  Mode mode = 2 [(buf.validate.field).enum = {not_in: [0]}];
  
  // IV size in bits. 128 for CBC/CTR (block size), 0 for ECB.
  // Camellia uses 128-bit block size (same as AES).
  uint32 iv_size_bits = 3 [(buf.validate.field).uint32 = {in: [0, 128]}];
  
  // Counter bits for CTR mode (1-128).
  // PKCS#11: CK_CAMELLIA_CTR_PARAMS.ulCounterBits
  // Specifies how many rightmost bits of the counter block to increment.
  uint32 counter_bits = 4 [(buf.validate.field).uint32 = {gte: 1, lte: 128}];
  
  // Padding scheme for CBC mode.
  PaddingScheme padding = 5;
}

// AriaParams defines parameters for ARIA cipher (Korean standard).
// CycloneDX pattern: ARIA-{keyLength}-{mode}
// PKCS#11 Mechanisms: CKM_ARIA_ECB, CKM_ARIA_CBC, CKM_ARIA_MAC
// PKCS#11 Key Type: CKK_ARIA
// PKCS#11 Reference Struct: CK_ARIA_CBC_ENCRYPT_DATA_PARAMS
// Standards: KS X 1213, RFC 5794
message AriaParams {
  // Key size in bits.
  // PKCS#11: CKA_VALUE_LEN = 16, 24, or 32 bytes
  uint32 key_size_bits = 1 [(buf.validate.field).uint32 = {in: [128, 192, 256]}];
  
  // Block cipher mode.
  // PKCS#11: CKM_ARIA_ECB, CKM_ARIA_CBC
  enum Mode {
    MODE_UNSPECIFIED = 0;
    ECB = 1;   // CKM_ARIA_ECB
    CBC = 2;   // CKM_ARIA_CBC
  }
  Mode mode = 2 [(buf.validate.field).enum = {not_in: [0]}];
  
  // IV size in bits. 128 for CBC (block size), 0 for ECB.
  // ARIA uses 128-bit block size (same as AES).
  uint32 iv_size_bits = 3 [(buf.validate.field).uint32 = {in: [0, 128]}];
  
  // Padding scheme for CBC mode.
  PaddingScheme padding = 4;
}

// SeedParams defines parameters for SEED cipher (Korean standard).
// CycloneDX pattern: SEED-{mode}
// PKCS#11 Mechanisms: CKM_SEED_ECB, CKM_SEED_CBC, CKM_SEED_MAC
// PKCS#11 Key Type: CKK_SEED
// Standards: KISA SEED, RFC 4269
// NOTE: SEED only supports 128-bit keys (fixed)
message SeedParams {
  // Key size is FIXED at 128 bits (16 bytes).
  // PKCS#11: CKA_VALUE_LEN = 16 (always)
  uint32 key_size_bits = 1 [(buf.validate.field).uint32.const = 128];
  
  // Block cipher mode.
  // PKCS#11: CKM_SEED_ECB, CKM_SEED_CBC
  enum Mode {
    MODE_UNSPECIFIED = 0;
    ECB = 1;   // CKM_SEED_ECB
    CBC = 2;   // CKM_SEED_CBC
  }
  Mode mode = 2 [(buf.validate.field).enum = {not_in: [0]}];
  
  // IV size in bits. 128 for CBC (block size), 0 for ECB.
  // SEED uses 128-bit block size.
  uint32 iv_size_bits = 3 [(buf.validate.field).uint32 = {in: [0, 128]}];
  
  // Padding scheme for CBC mode.
  PaddingScheme padding = 4;
}

// ============================================================================
// Russian Standards - GOST Family (Phase 2.4)
// PKCS#11 Reference: pkcs11-curr-v3.0 Section 2.34 (GOST)
// ============================================================================

// Gost28147Params defines parameters for GOST 28147-89 block cipher.
// CycloneDX pattern: GOST28147-{mode}
// PKCS#11 Mechanisms: CKM_GOST28147_ECB, CKM_GOST28147, CKM_GOST28147_MAC
// PKCS#11 Key Type: CKK_GOST28147
// NOTE: Block size is 64 bits (smaller than AES's 128 bits)
// NOTE: Key size is fixed at 256 bits
message Gost28147Params {
  // Block cipher mode.
  // PKCS#11: CKM_GOST28147_ECB, CKM_GOST28147 (CFB is default naming)
  enum Mode {
    MODE_UNSPECIFIED = 0;
    ECB = 1;   // CKM_GOST28147_ECB
    CBC = 2;   // CKM_GOST28147 cipher feedback variant
    CFB = 3;   // Cipher Feedback mode
  }
  Mode mode = 1 [(buf.validate.field).enum = {not_in: [0]}];
  
  // IV size in bits. 64 for CBC/CFB (64-bit block size), 0 for ECB.
  // GOST 28147-89 uses 64-bit block size.
  uint32 iv_size_bits = 2 [(buf.validate.field).uint32 = {in: [0, 64]}];
  
  // S-box parameter set OID (Russian regulatory requirement).
  // PKCS#11: CKA_GOST28147_PARAMS
  // Common: "id-Gost28147-89-CryptoPro-A-ParamSet" (1.2.643.2.2.31.1)
  string sbox_oid = 3 [(buf.validate.field).string.max_len = 128];
}

// Gost3411Params defines parameters for GOST R 34.11-94 hash function.
// CycloneDX pattern: GOSTR3411-94
// PKCS#11 Mechanism: CKM_GOSTR3411
// NOTE: Output is fixed at 256 bits
message Gost3411Params {
  // Initial hash value (IHV) customization (optional).
  // Most implementations use default IHV.
  bytes initial_value = 1 [(buf.validate.field).bytes.max_len = 32];
}

// Gost3410Params defines parameters for GOST R 34.10-2001/2012 digital signature.
// CycloneDX pattern: GOSTR3410-{year}
// PKCS#11 Mechanisms: CKM_GOSTR3410, CKM_GOSTR3410_WITH_GOSTR3411
// PKCS#11 Key Types: CKK_GOSTR3410, CKK_GOSTR3410_512
// PKCS#11 Reference Struct: CK_GOSTR3410_DERIVE_PARAMS
message Gost3410Params {
  // Algorithm version/year.
  enum Version {
    VERSION_UNSPECIFIED = 0;
    GOST_2001 = 1;   // GOST R 34.10-2001 (256-bit keys)
    GOST_2012 = 2;   // GOST R 34.10-2012 (256 or 512-bit keys)
  }
  Version version = 1 [(buf.validate.field).enum = {not_in: [0]}];
  
  // Key size in bits.
  // GOST 2001: 256 bits only
  // GOST 2012: 256 or 512 bits
  uint32 key_size_bits = 2 [(buf.validate.field).uint32 = {in: [256, 512]}];
  
  // Parameter set OID (Russian regulatory requirement).
  // PKCS#11: CKA_GOSTR3410_PARAMS
  // Example: "1.2.643.2.2.35.1" (CryptoPro-A)
  string parameter_set_oid = 3 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  
  // Digest parameter set OID (links to GOST R 34.11).
  // PKCS#11: CKA_GOSTR3411_PARAMS
  string digest_param_set_oid = 4 [(buf.validate.field).string.max_len = 64];
  
  // Cross-field validation: GOST 2001 only supports 256-bit keys
  option (buf.validate.message).cel = {
    id: "gost_version_key_size"
    message: "GOST R 34.10-2001 only supports 256-bit keys; 512-bit requires GOST 2012"
    expression: "this.version != 1 || this.key_size_bits == 256u"
  };
}

