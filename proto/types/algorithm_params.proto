// ============================================================================

// CustomAlgorithm provides an escape hatch for:
// - Vendor-specific algorithms not in the standard catalog
// - Future algorithms before formal proto schema support
// - Experimental or non-standard cryptographic schemes
//
// Use cases:
// - HSM vendor's proprietary algorithm (use KEY_TYPE_VENDOR)
// - Pre-standard PQC algorithms during transition (use KEY_TYPE_PQ_EXPERIMENTAL)
// - Custom hybrid schemes (use KEY_TYPE_CUSTOM or KEY_TYPE_HYBRID)
//
// Key Type Selection:
// - KEY_TYPE_VENDOR (100): Vendor-specific HSM/KMS algorithms
// - KEY_TYPE_PQ_EXPERIMENTAL (101): Pre-standard PQ algorithms (BIKE, HQC, McEliece)
// - KEY_TYPE_CUSTOM (199): Any other custom algorithm
//
// IMPORTANT: Implementations SHOULD validate custom algorithms against
// an allow-list in policy configuration.
//
// Example for pre-standard PQ KEM (Classic McEliece):
//   CustomAlgorithm {
//     vendor: "pqcrypto"
//     name: "Classic-McEliece-6960119"
//     key_type: KEY_TYPE_PQ_EXPERIMENTAL
//     key_size_bits: 13568  // public key bits
//     generic_params: {"n": 6960, "t": 119}
//   }
//
// This keeps CustomAlgorithm focused on algorithm-specific data only.
message CustomAlgorithm {
  // Vendor identifier (e.g., "ibm", "thales", "aws").
  // Empty string for non-vendor-specific algorithms.
  string vendor = 1 [(buf.validate.field).string.max_len = 64];
  
  // Algorithm name (e.g., "AES_GCM_SIV", "XMSS", "LMS").
  // Should follow consistent naming conventions.
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  
  // Key type for this algorithm.
  // Required for DeriveMetadata to determine key_type.
  KeyType key_type = 3;
  
  // Key size in bits (if applicable).
  // Required for DeriveMetadata to determine key_size_bits.
  // Set to 0 if not applicable or variable.
  uint32 key_size_bits = 4;
  
  // Algorithm parameters.
  // Use generic_params for simple cases, typed_params for vendor-defined messages.
  oneof params {
    // Unstructured parameters as JSON-like key-value pairs.
    // Use for simple cases or unknown parameter sets.
    // Example: {"iv_size": 128, "mode": "SIV"}
    google.protobuf.Struct generic_params = 10;
    
    // Strongly-typed parameters using Any.
    // Allows vendors to define their own parameter messages.
    // The type URL identifies the parameter message type.
    // Example: type.googleapis.com/vendor.crypto.CustomCipherParams
    google.protobuf.Any typed_params = 11;
  }
}

// VendorAlgorithmRegistry allows vendors to register their algorithm definitions.
// This can be loaded from vendor-specific JSON/YAML configuration files.
//
// Usage:
// 1. Vendor publishes registry file with their algorithms
// 2. CaaS loads registry at startup
// 3. Templates can reference vendor algorithms via CustomAlgorithm
message VendorAlgorithmRegistry {
  // Vendor identifier (must match CustomAlgorithm.vendor).
  string vendor_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  
  // Vendor display name.
  string vendor_name = 2 [(buf.validate.field).string.max_len = 256];
  
  // Vendor-specific algorithm definitions.
  // Key is the algorithm name (e.g., "VENDOR_AES_GCM_SIV").
  map<string, CustomAlgorithm> algorithms = 3;
  
  // Version of this vendor registry (semver recommended).
  string version = 4 [(buf.validate.field).string.max_len = 32];
  
  // Human-readable description of the vendor's crypto offerings.
  string description = 5 [(buf.validate.field).string.max_len = 2048];
  
  // Contact URL for vendor support.
  string support_url = 6 [(buf.validate.field).string.max_len = 512];
}
