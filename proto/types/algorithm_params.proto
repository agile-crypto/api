// HotpParams defines parameters for HOTP (HMAC-based One-Time Password).
// CycloneDX pattern: HOTP-{hash}-{digits}
// PKCS#11 Mechanisms: CKM_HOTP_KEY_GEN, CKM_HOTP
// PKCS#11 Key Type: CKK_HOTP
// PKCS#11 Reference Struct: CK_OTP_PARAMS, CK_OTP_PARAM
// Standards: RFC 4226
message HotpParams {
  // Hash algorithm for HMAC.
  // PKCS#11: Part of key attributes (typically SHA-1 per RFC 4226)
  // Standard uses SHA-1, but SHA-256/512 are supported.
  HashAlgorithm hash = 1;
  
  // Number of digits in OTP output (6 or 8).
  // PKCS#11: CK_OTP_OUTPUT_LENGTH (CK_OTP_PARAM with type=CK_OTP_OUTPUT_LENGTH)
  uint32 digits = 2 [(buf.validate.field).uint32 = {in: [6, 8]}];
  
  // Initial counter value.
  // PKCS#11: CK_OTP_COUNTER attribute on key (CK_OTP_PARAM with type=CK_OTP_COUNTER)
  uint64 counter_start = 3;
}

// TotpParams defines parameters for TOTP (Time-based One-Time Password).
// CycloneDX pattern: TOTP-{hash}-{digits}-{timeStep}
// PKCS#11: Uses CKM_HOTP with time-based counter (CK_OTP_TIME param)
// PKCS#11 Reference Struct: CK_OTP_PARAMS with CK_OTP_TIME parameter
// Standards: RFC 6238
message TotpParams {
  // Hash algorithm for HMAC.
  // Standard uses SHA-1, but SHA-256/512 are supported.
  HashAlgorithm hash = 1;
  
  // Number of digits in OTP output (6 or 8).
  // PKCS#11: CK_OTP_OUTPUT_LENGTH
  uint32 digits = 2 [(buf.validate.field).uint32 = {in: [6, 8]}];
  
  // Time step in seconds (default: 30).
  // PKCS#11: CK_OTP_TIME attribute handling
  uint32 time_step_seconds = 3 [(buf.validate.field).uint32 = {gte: 1, lte: 300}];
  
  // Unix epoch start time T0 (default: 0).
  uint64 t0 = 4;
}

// ============================================================================
// Signal Protocol (Phase 3.2)
// PKCS#11 Reference: pkcs11-curr-v3.0 Section 2.42 (X3DH)
// ============================================================================

// X3dhParams defines parameters for Extended Triple Diffie-Hellman (X3DH).
// CycloneDX pattern: X3DH
// PKCS#11 Mechanisms: CKM_X3DH_INITIALIZE, CKM_X3DH_RESPOND
// PKCS#11 Reference Structs: CK_X3DH_INITIATE_PARAMS, CK_X3DH_RESPOND_PARAMS
// Used in: Signal Protocol, Matrix, Wire
message X3dhParams {
  // Role in X3DH handshake.
  // PKCS#11: CKM_X3DH_INITIALIZE (initiator), CKM_X3DH_RESPOND (responder)
  enum Role {
    ROLE_UNSPECIFIED = 0;
    INITIATOR = 1;   // Alice (initiates handshake)
    RESPONDER = 2;   // Bob (responds with signed prekey)
  }
  Role role = 1 [(buf.validate.field).enum = {not_in: [0]}];
  
  // KDF for final shared secret derivation.
  // PKCS#11: CK_X3DH_KDF_TYPE (CKD_X3DH_KDF_SHA256, etc.)
  enum X3dhKdfType {
    X3DH_KDF_UNSPECIFIED = 0;
    X3DH_KDF_SHA256 = 1;       // CKD_X3DH_KDF_SHA256
    X3DH_KDF_SHA512 = 2;       // CKD_X3DH_KDF_SHA512
    X3DH_KDF_BLAKE2B_256 = 3;  // CKD_X3DH_KDF_BLAKE2B_256
    X3DH_KDF_BLAKE2B_512 = 4;  // CKD_X3DH_KDF_BLAKE2B_512
  }
  X3dhKdfType kdf = 2;
}

