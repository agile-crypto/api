  option (buf.validate.message).cel = {
    id: "dsa_parameter_consistency"
    message: "DSA parameters must match FIPS 186-4: L=2048→N=224/256, L=3072→N=256"
    expression: "(this.modulus_bits == 2048u && (this.subprime_bits == 224u || this.subprime_bits == 256u)) || (this.modulus_bits == 3072u && this.subprime_bits == 256u)"
