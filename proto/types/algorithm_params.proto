syntax = "proto3";

package caas.crypto.v1;

option go_package = "github.ibm.com/citius/api/gen/go/types;types";

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/any.proto";

// ============================================================================
// Algorithm Parameter Enums
// ============================================================================
// These enums replace string-based parameters for type safety and validation.
// They are used in algorithm-specific parameter messages (Phase 2) and provide
// compile-time type checking instead of runtime string parsing.
//
// Design principles:
// - Every enum has an UNSPECIFIED = 0 value for proto3 compatibility
// - Enum names follow UPPER_SNAKE_CASE convention
// - Values are grouped logically with comments
// - CycloneDX alignment where applicable

// ============================================================================
// Hash Algorithms
// ============================================================================

// HashAlgorithm specifies supported cryptographic hash functions.
// Used in signatures, MACs, KDFs, and key derivation.
// PKCS#11 Reference: CKM_SHA* mechanisms in pkcs11-curr-v3.0
enum HashAlgorithm {
  HASH_ALGORITHM_UNSPECIFIED = 0;
  
  // SHA-2 family (NIST FIPS 180-4)
  HASH_ALGORITHM_SHA256 = 1;       // SHA-256 (256-bit output)
  HASH_ALGORITHM_SHA384 = 2;       // SHA-384 (384-bit output)
  HASH_ALGORITHM_SHA512 = 3;       // SHA-512 (512-bit output)
  HASH_ALGORITHM_SHA512_256 = 4;   // SHA-512/256 (256-bit output, 64-bit optimized)
  HASH_ALGORITHM_SHA224 = 5;       // SHA-224 (224-bit output, truncated SHA-256)
  HASH_ALGORITHM_SHA512_224 = 6;   // SHA-512/224 (224-bit output, 64-bit optimized)
  
  // SHA-3 family (NIST FIPS 202)
  HASH_ALGORITHM_SHA3_256 = 10;    // SHA3-256 (256-bit output)
  HASH_ALGORITHM_SHA3_384 = 11;    // SHA3-384 (384-bit output)
  HASH_ALGORITHM_SHA3_512 = 12;    // SHA3-512 (512-bit output)
  HASH_ALGORITHM_SHA3_224 = 13;    // SHA3-224 (224-bit output)
  
  // SHAKE extendable output functions (NIST FIPS 202)
  HASH_ALGORITHM_SHAKE128 = 20;    // SHAKE128 (variable output, 128-bit security)
  HASH_ALGORITHM_SHAKE256 = 21;    // SHAKE256 (variable output, 256-bit security)
  
  // BLAKE2 family (RFC 7693)
  HASH_ALGORITHM_BLAKE2B_256 = 30; // BLAKE2b with 256-bit output
  HASH_ALGORITHM_BLAKE2B_384 = 31; // BLAKE2b with 384-bit output
  HASH_ALGORITHM_BLAKE2B_512 = 32; // BLAKE2b with 512-bit output (default)
  HASH_ALGORITHM_BLAKE2S_256 = 33; // BLAKE2s with 256-bit output (optimized for 32-bit)
  HASH_ALGORITHM_BLAKE2B_160 = 34; // BLAKE2b with 160-bit output
  HASH_ALGORITHM_BLAKE2S_128 = 35; // BLAKE2s with 128-bit output
  HASH_ALGORITHM_BLAKE2S_160 = 36; // BLAKE2s with 160-bit output
  HASH_ALGORITHM_BLAKE2S_224 = 37; // BLAKE2s with 224-bit output
  
  // BLAKE3 (newer, faster, unified)
  HASH_ALGORITHM_BLAKE3 = 40;      // BLAKE3 (256-bit output by default, extendable)
  
  // Regional standards
  // PKCS#11: CKM_GOSTR3411, CKM_GOSTR3411_12_256, CKM_GOSTR3411_12_512
  HASH_ALGORITHM_GOST_R3411_94 = 50;    // GOST R 34.11-94 (Russia, 256-bit)
  HASH_ALGORITHM_GOST_R3411_2012_256 = 51; // GOST R 34.11-2012 (Streebog-256)
  HASH_ALGORITHM_GOST_R3411_2012_512 = 52; // GOST R 34.11-2012 (Streebog-512)
  
  // Legacy (NOT RECOMMENDED for new applications)
  // PKCS#11: CKM_SHA_1, CKM_MD5 (pkcs11-hist-v3.0)
  HASH_ALGORITHM_SHA1 = 100 [deprecated = true];  // SHA-1 (160-bit, collision attacks known)
  HASH_ALGORITHM_MD5 = 101 [deprecated = true];   // MD5 (128-bit, severely broken)
  
  // Extensible: use with hash_algorithm_oid for algorithms not in this enum
  HASH_ALGORITHM_OTHER = 200;  // Set this + hash_algorithm_oid for unlisted algorithms
}

// ============================================================================
// Elliptic Curves
// ============================================================================

// EllipticCurve specifies supported elliptic curves for ECDSA, ECDH, etc.
// Curves are grouped by standardization body and security level.
// PKCS#11 Reference: CKA_EC_PARAMS OIDs in pkcs11-curr-v3.0
enum EllipticCurve {
  ELLIPTIC_CURVE_UNSPECIFIED = 0;
  
  // NIST curves (FIPS 186-4) - Most widely supported
  // PKCS#11: Standard OIDs in CKA_EC_PARAMS
  ELLIPTIC_CURVE_P256 = 1;         // NIST P-256 / secp256r1 / prime256v1 (128-bit security)
  ELLIPTIC_CURVE_P384 = 2;         // NIST P-384 / secp384r1 (192-bit security)
  ELLIPTIC_CURVE_P521 = 3;         // NIST P-521 / secp521r1 (256-bit security)
  
  // Modern curves (RFC 7748, RFC 8032)
  // PKCS#11: CKK_EC_EDWARDS, CKK_EC_MONTGOMERY key types
  ELLIPTIC_CURVE_CURVE25519 = 10;  // Curve25519 for X25519/Ed25519 (128-bit security)
  ELLIPTIC_CURVE_CURVE448 = 11;    // Curve448 for X448/Ed448 (224-bit security)
  
  // Koblitz curve (SEC 2)
  ELLIPTIC_CURVE_SECP256K1 = 20;   // secp256k1 - Bitcoin/Ethereum (128-bit security)
  
  // Brainpool curves (RFC 5639) - European standard
  // PKCS#11: Standard OIDs in CKA_EC_PARAMS
  ELLIPTIC_CURVE_BRAINPOOL_P256R1 = 30;  // brainpoolP256r1 (128-bit security)
  ELLIPTIC_CURVE_BRAINPOOL_P384R1 = 31;  // brainpoolP384r1 (192-bit security)
  ELLIPTIC_CURVE_BRAINPOOL_P512R1 = 32;  // brainpoolP512r1 (256-bit security)
  ELLIPTIC_CURVE_BRAINPOOL_P256T1 = 33;  // brainpoolP256t1 (twisted variant)
  ELLIPTIC_CURVE_BRAINPOOL_P384T1 = 34;  // brainpoolP384t1 (twisted variant)
  ELLIPTIC_CURVE_BRAINPOOL_P512T1 = 35;  // brainpoolP512t1 (twisted variant)
  
  // NIST binary field curves (FIPS 186-4 Appendix D) - Legacy
  // Koblitz (K) and random (B) curves over F(2^m)
  // NOTE: Binary curves have declining support; prime curves preferred
  ELLIPTIC_CURVE_K163 = 40;        // sect163k1 - Koblitz, 80-bit security
  ELLIPTIC_CURVE_B163 = 41;        // sect163r2 - Random, 80-bit security
  ELLIPTIC_CURVE_K233 = 42;        // sect233k1 - Koblitz, 112-bit security
  ELLIPTIC_CURVE_B233 = 43;        // sect233r1 - Random, 112-bit security
  ELLIPTIC_CURVE_K283 = 44;        // sect283k1 - Koblitz, 128-bit security
  ELLIPTIC_CURVE_B283 = 45;        // sect283r1 - Random, 128-bit security
  ELLIPTIC_CURVE_K409 = 46;        // sect409k1 - Koblitz, 192-bit security
  ELLIPTIC_CURVE_B409 = 47;        // sect409r1 - Random, 192-bit security
  ELLIPTIC_CURVE_K571 = 48;        // sect571k1 - Koblitz, 256-bit security
  ELLIPTIC_CURVE_B571 = 49;        // sect571r1 - Random, 256-bit security
}

// ============================================================================
// Padding Schemes
// ============================================================================

// PaddingScheme specifies block cipher padding modes.
// Used with CBC and other block cipher modes that require padding.
enum PaddingScheme {
  PADDING_SCHEME_UNSPECIFIED = 0;
  PADDING_SCHEME_NONE = 1;         // No padding - input must be block-aligned
  PADDING_SCHEME_PKCS7 = 2;        // PKCS#7 padding (RFC 5652) - recommended
  PADDING_SCHEME_ISO7816 = 3;      // ISO/IEC 7816-4 padding (0x80 followed by zeros)
  PADDING_SCHEME_X923 = 4;         // ANSI X9.23 padding (zeros followed by length)
  PADDING_SCHEME_ZERO = 5;         // Zero padding - not recommended (ambiguous)
}

// ============================================================================
// Signature Formats
// ============================================================================

// SignatureFormat specifies signature encoding formats.
// Different formats are required for different protocols and systems.
enum SignatureFormat {
  SIGNATURE_FORMAT_UNSPECIFIED = 0;
  SIGNATURE_FORMAT_DER = 1;        // ASN.1 DER encoding (default for ECDSA, RSA)
  SIGNATURE_FORMAT_IEEE_P1363 = 2; // Fixed-size r||s concatenation (WebCrypto, JWS)
  SIGNATURE_FORMAT_RAW = 3;        // Raw bytes (Ed25519/Ed448 native format)
}

// ============================================================================
// Mask Generation Functions
// ============================================================================

// MaskGenerationFunction specifies MGF algorithms for RSA-OAEP and RSA-PSS.
// Currently only MGF1 is standardized (PKCS#1 v2.1).
enum MaskGenerationFunction {
  MGF_UNSPECIFIED = 0;
  MGF_MGF1 = 1;                    // MGF1 (PKCS#1 v2.1) - only standardized option
}

// ============================================================================
// Argon2 Variants
// ============================================================================

// Argon2Variant specifies Argon2 password hashing algorithm variants.
// Argon2 won the Password Hashing Competition (2015).
enum Argon2Variant {
  ARGON2_VARIANT_UNSPECIFIED = 0;
  ARGON2_VARIANT_D = 1;            // Argon2d - Data-dependent, GPU/ASIC resistant
  ARGON2_VARIANT_I = 2;            // Argon2i - Data-independent, side-channel resistant
  ARGON2_VARIANT_ID = 3;           // Argon2id - Hybrid (recommended for password hashing)
}

// ============================================================================
// Ed25519/Ed448 Variants
// ============================================================================

// Ed25519Variant specifies Ed25519 signing variants per RFC 8032.
enum Ed25519Variant {
  ED25519_VARIANT_UNSPECIFIED = 0;
  ED25519_VARIANT_PURE = 1;        // Ed25519 - Pure mode (standard, recommended)
  ED25519_VARIANT_CTX = 2;         // Ed25519ctx - With context string
  ED25519_VARIANT_PH = 3;          // Ed25519ph - Prehashed (for large messages)
}

// Ed448Variant specifies Ed448 signing variants per RFC 8032.
enum Ed448Variant {
  ED448_VARIANT_UNSPECIFIED = 0;
  ED448_VARIANT_PURE = 1;          // Ed448 - Pure mode (context can still be used)
  ED448_VARIANT_PH = 2;            // Ed448ph - Prehashed (SHAKE256)
}

// ============================================================================
// Key Types
// ============================================================================

// KeyType specifies the type of cryptographic key.
// Used for key management, storage, and provider selection.
// PKCS#11 Reference: CKK_* key type constants in pkcs11-curr-v3.0
enum KeyType {
  KEY_TYPE_UNSPECIFIED = 0;
  
  // Symmetric keys
  // PKCS#11: CKK_AES, CKK_DES3, CKK_CHACHA20, CKK_CAMELLIA, CKK_ARIA, CKK_SEED, etc.
  KEY_TYPE_SYMMETRIC = 1;          // AES, ChaCha20, 3DES, Camellia, ARIA, SEED, etc.
  
  // Classical asymmetric keys
  // PKCS#11: CKK_RSA
  KEY_TYPE_RSA = 10;               // RSA keys (signing, encryption)
  // PKCS#11: CKK_EC for NIST/Brainpool/secp256k1 curves
  KEY_TYPE_EC = 11;                // NIST/Brainpool curve EC keys (ECDSA, ECDH)
  // PKCS#11: CKK_EC_EDWARDS (RFC 8032)
  KEY_TYPE_ED25519 = 12;           // Ed25519 keys (signing only)
  KEY_TYPE_ED448 = 13;             // Ed448 keys (signing only)
  // PKCS#11: CKK_EC_MONTGOMERY (RFC 7748)
  KEY_TYPE_X25519 = 14;            // X25519 keys (key agreement only)
  KEY_TYPE_X448 = 15;              // X448 keys (key agreement only)
  // PKCS#11: CKK_DSA
  KEY_TYPE_DSA = 16;               // DSA keys (legacy, prefer ECDSA)
  // PKCS#11: CKK_DH (PKCS#3), CKK_X9_42_DH (X9.42)
  KEY_TYPE_DH = 17;                // Diffie-Hellman keys (finite field)
  
  // Post-quantum keys (NIST PQC standards)
  // PKCS#11 v3.2+: CKK_ML_KEM
  KEY_TYPE_ML_KEM = 20;            // ML-KEM (FIPS 203, formerly Kyber)
  // PKCS#11 v3.2+: CKK_ML_DSA
  KEY_TYPE_ML_DSA = 21;            // ML-DSA (FIPS 204, formerly Dilithium)
  // PKCS#11 v3.2+: CKK_SLH_DSA
  KEY_TYPE_SLH_DSA = 22;           // SLH-DSA (FIPS 205, formerly SPHINCS+)
  
  // Hybrid/composite keys
  KEY_TYPE_HYBRID = 30;            // Combined classical + PQ keys
  
  // Regional/national standard keys
  // PKCS#11: CKK_GOSTR3410 (GOST R 34.10-2001), CKK_GOSTR3410_512 (GOST R 34.10-2012)
  KEY_TYPE_GOST = 40;              // GOST R 34.10 keys (Russian standard)
  
  // Special-purpose keys
  // PKCS#11: CKK_HOTP (used for both HOTP and TOTP)
  KEY_TYPE_OTP = 50;               // HOTP/TOTP keys (RFC 4226, RFC 6238)
  
  // =========================================================================
  // Extensibility: Vendor, Experimental, and Custom Key Types
  // =========================================================================
  // These key types provide forward compatibility for:
  // - Vendor-specific HSM/KMS proprietary algorithms
  // - Pre-standard post-quantum algorithms (NIST Round 4 candidates, etc.)
  // - Custom or experimental cryptographic schemes
  //
  // IMPORTANT: Use CustomAlgorithm in AlgorithmDetails to specify the actual
  // algorithm parameters when using these key types.
  
  // PKCS#11: CKK_VENDOR_DEFINED (0x80000000+)
  // Use for HSM vendor proprietary key types (e.g., Thales Luna, Entrust nShield).
  // The specific algorithm is defined in CustomAlgorithm.vendor and .name fields.
  KEY_TYPE_VENDOR = 100;
  
  // Post-quantum algorithms not yet standardized by NIST.
  // Examples: BIKE, HQC, Classic McEliece, FrodoKEM, NTRU variants
  // Once standardized, these should migrate to dedicated KEY_TYPE_* values.
  // Use CustomAlgorithm.name to identify the specific PQ algorithm.
  KEY_TYPE_PQ_EXPERIMENTAL = 101;
  
  // Generic custom key type for any other scenario.
  // Use CustomAlgorithm to fully specify the algorithm details.
  // Policy engines SHOULD validate custom algorithms against an allow-list.
  KEY_TYPE_CUSTOM = 199;
}

// ============================================================================
// Cryptographic Primitives (CycloneDX aligned)
// ============================================================================

// CryptoPrimitive specifies the cryptographic primitive type.
// Aligns with CycloneDX CBOM v1.7 cryptographic asset classification.
// Used for template categorization and discovery.
enum CryptoPrimitive {
  CRYPTO_PRIMITIVE_UNSPECIFIED = 0;
  
  // Encryption primitives
  CRYPTO_PRIMITIVE_AE = 1;             // Authenticated encryption (AES-GCM, ChaCha20-Poly1305, AES-CCM)
  CRYPTO_PRIMITIVE_BLOCK_CIPHER = 2;   // Block cipher (AES-CBC, AES-CTR, AES-XTS, Camellia, ARIA)
  CRYPTO_PRIMITIVE_STREAM_CIPHER = 3;  // Stream cipher (ChaCha20, GOST 28147-CNT)
  CRYPTO_PRIMITIVE_PKE = 4;            // Public key encryption (RSA-OAEP)
  
  // Signature primitives
  CRYPTO_PRIMITIVE_SIGNATURE = 10;     // Digital signatures (ECDSA, Ed25519, RSA-PSS, DSA, GOST 34.10)
  
  // Key exchange primitives
  CRYPTO_PRIMITIVE_KEM = 20;           // Key encapsulation mechanism (ML-KEM, RSA-KEM)
  CRYPTO_PRIMITIVE_KEY_AGREE = 21;     // Key agreement (ECDH, X25519, DH, X3DH)
  
  // Hash and MAC primitives
  CRYPTO_PRIMITIVE_HASH = 30;          // Cryptographic hash (SHA-256, SHA-3, GOST 34.11)
  CRYPTO_PRIMITIVE_MAC = 31;           // Message authentication code (HMAC, KMAC, CMAC, Poly1305)
  CRYPTO_PRIMITIVE_XOF = 32;           // Extendable output function (SHAKE, BLAKE3)
  
  // Key management primitives
  CRYPTO_PRIMITIVE_KDF = 40;           // Key derivation function (HKDF, PBKDF2, Argon2, SP 800-108, TLS 1.2)
  CRYPTO_PRIMITIVE_KEY_WRAP = 41;      // Key wrapping (AES-KW, AES-KWP)
  
  // Authentication primitives
  CRYPTO_PRIMITIVE_OTP = 45;           // One-time password (HOTP, TOTP)
  
  // Other primitives
  CRYPTO_PRIMITIVE_DRBG = 50;          // Deterministic random bit generator
  CRYPTO_PRIMITIVE_COMBINER = 51;      // Hybrid/composite combiner
  CRYPTO_PRIMITIVE_OTHER = 99;
}

// ============================================================================
// ML-DSA Parameter Sets (FIPS 204)
// ============================================================================

// MlDsaParameterSet enumerates ML-DSA (formerly Dilithium) parameter sets.
// Each parameter set provides a different security level.
enum MlDsaParameterSet {
  ML_DSA_PARAMETER_SET_UNSPECIFIED = 0;
  ML_DSA_44 = 1;                   // ML-DSA-44: NIST Level 2 (128-bit classical security)
  ML_DSA_65 = 2;                   // ML-DSA-65: NIST Level 3 (192-bit classical security)
  ML_DSA_87 = 3;                   // ML-DSA-87: NIST Level 5 (256-bit classical security)
}

// ============================================================================
// ML-KEM Parameter Sets (FIPS 203)
// ============================================================================

// MlKemParameterSet enumerates ML-KEM (formerly Kyber) parameter sets.
// Each parameter set provides a different security level.
enum MlKemParameterSet {
  ML_KEM_PARAMETER_SET_UNSPECIFIED = 0;
  ML_KEM_512 = 1;                  // ML-KEM-512: NIST Level 1 (128-bit classical security)
  ML_KEM_768 = 2;                  // ML-KEM-768: NIST Level 3 (192-bit classical security)
  ML_KEM_1024 = 3;                 // ML-KEM-1024: NIST Level 5 (256-bit classical security)
}

// ============================================================================
// SLH-DSA Parameter Sets (FIPS 205)
// ============================================================================

// SlhDsaHashType specifies the hash function family for SLH-DSA.
enum SlhDsaHashType {
  SLH_DSA_HASH_TYPE_UNSPECIFIED = 0;
  SLH_DSA_SHA2 = 1;                // SHA-256 based
  SLH_DSA_SHAKE = 2;               // SHAKE256 based
}

// SlhDsaParameterSet enumerates SLH-DSA (formerly SPHINCS+) parameter sets.
// 's' suffix = smaller signatures, 'f' suffix = faster signing.
enum SlhDsaParameterSet {
  SLH_DSA_PARAMETER_SET_UNSPECIFIED = 0;
  
  // 128-bit security (NIST Level 1)
  SLH_DSA_128S = 1;                // Small signatures (~7KB)
  SLH_DSA_128F = 2;                // Fast signing (~17KB signatures)
  
  // 192-bit security (NIST Level 3)
  SLH_DSA_192S = 3;                // Small signatures (~16KB)
  SLH_DSA_192F = 4;                // Fast signing (~35KB signatures)
  
  // 256-bit security (NIST Level 5)
  SLH_DSA_256S = 5;                // Small signatures (~29KB)
  SLH_DSA_256F = 6;                // Fast signing (~49KB signatures)
}

// ============================================================================
// ECDH KDF Types
// ============================================================================

// EcdhKdfType specifies KDF to apply to ECDH shared secret.
enum EcdhKdfType {
  ECDH_KDF_UNSPECIFIED = 0;        // Return raw shared secret (x-coordinate)
  ECDH_KDF_HKDF_SHA256 = 1;        // HKDF with SHA-256
  ECDH_KDF_HKDF_SHA384 = 2;        // HKDF with SHA-384
  ECDH_KDF_HKDF_SHA512 = 3;        // HKDF with SHA-512
  ECDH_KDF_X963_SHA256 = 4;        // ANSI X9.63 KDF with SHA-256
  ECDH_KDF_X963_SHA384 = 5;        // ANSI X9.63 KDF with SHA-384
  ECDH_KDF_X963_SHA512 = 6;        // ANSI X9.63 KDF with SHA-512
}

// ============================================================================
// ============================================================================
//
//                    ALGORITHM-SPECIFIC PARAMETER MESSAGES
//
// ============================================================================
// ============================================================================
// Each message is SELF-CONTAINED per CycloneDX naming patterns.
// The oneof field in AlgorithmDetails selects which message to use.
// All algorithm metadata (name, variant, key size, key type) can be derived
// from the specific parameter message selected.

// ============================================================================
// Symmetric Encryption Parameters
// ============================================================================

// AesGcmParams defines parameters for AES-GCM authenticated encryption.
// CycloneDX pattern: AES-{keyLength}-GCM-{tagLength}-{ivLength}
// PKCS#11 Mechanism: CKM_AES_GCM
// PKCS#11 Reference Struct: CK_GCM_PARAMS
// Example: AES-256-GCM-128-96 → AesGcmParams{key_size_bits=256, tag_size_bits=128, iv_size_bits=96}
message AesGcmParams {
  // Key size in bits. Required. Valid: 128, 192, 256.
  // PKCS#11: CKA_VALUE_LEN = 16, 24, or 32 bytes
  uint32 key_size_bits = 1 [(buf.validate.field).uint32 = {in: [128, 192, 256]}];
  
  // IV size in bits. Default: 96 (12 bytes). NIST SP 800-38D recommended.
  // PKCS#11: CK_GCM_PARAMS.ulIvLen (bytes), ulIvBits (bits)
  // Valid values: 96 (recommended), 64, 128
  uint32 iv_size_bits = 2 [(buf.validate.field).uint32 = {in: [64, 96, 128]}];
  
  // Authentication tag size in bits. Default: 128.
  // Per NIST SP 800-38D §5.2.1, valid tag lengths are {128, 120, 112, 104, 96} bits only.
  // PKCS#11: CK_GCM_PARAMS.ulTagBits (valid: 32, 64, 96, 104, 112, 120, 128 — we restrict to ≥96)
  // Values below 96 bits (e.g., 32 or 64) are explicitly excluded as they provide
  // insufficient authentication strength per NIST guidance.
  // Valid values: 128 (recommended), 120, 112, 104, 96
  uint32 tag_size_bits = 3 [(buf.validate.field).uint32 = {in: [96, 104, 112, 120, 128]}];
}

// AesCbcParams defines parameters for AES-CBC encryption.
// CycloneDX pattern: AES-{keyLength}-CBC
// PKCS#11 Mechanism: CKM_AES_CBC, CKM_AES_CBC_PAD
// PKCS#11 Reference Struct: CK_AES_CBC_ENCRYPT_DATA_PARAMS (iv[16])
// Note: CBC mode requires separate MAC for authentication (not AEAD).
message AesCbcParams {
  // Key size in bits. Required. Valid: 128, 192, 256.
  // PKCS#11: CKA_VALUE_LEN = 16, 24, or 32 bytes
  uint32 key_size_bits = 1 [(buf.validate.field).uint32 = {in: [128, 192, 256]}];
  
  // IV size in bits. Must equal block size (128 bits for AES).
  // PKCS#11: CK_AES_CBC_ENCRYPT_DATA_PARAMS.iv[16] - fixed 16 bytes
  uint32 iv_size_bits = 2 [(buf.validate.field).uint32.const = 128];
  
  // Padding scheme. Default: PKCS7.
  // PKCS#11: CKM_AES_CBC (no padding) vs CKM_AES_CBC_PAD (PKCS7)
  PaddingScheme padding = 3 [(buf.validate.field).enum = {not_in: [0]}];
}

// AesCtrParams defines parameters for AES-CTR encryption.
// CycloneDX pattern: AES-{keyLength}-CTR
// PKCS#11 Mechanism: CKM_AES_CTR
// PKCS#11 Reference Struct: CK_AES_CTR_PARAMS
// Note: CTR mode requires separate MAC for authentication (not AEAD).
message AesCtrParams {
  // Key size in bits. Required. Valid: 128, 192, 256.
  uint32 key_size_bits = 1 [(buf.validate.field).uint32 = {in: [128, 192, 256]}];
  
  // Nonce size in bits. Default: 96 (leaving 32 bits for counter).
  // PKCS#11: Nonce is part of cb[16] counter block
  // Common values: 64 (nonce) + 64 (counter), 96 (nonce) + 32 (counter)
  uint32 nonce_size_bits = 2 [(buf.validate.field).uint32 = {in: [64, 96]}];
  
  // Number of counter bits to increment (rightmost bits of 128-bit block).
  // PKCS#11: CK_AES_CTR_PARAMS.ulCounterBits (1-128)
  // Common values: 32 (with 96-bit nonce), 64 (with 64-bit nonce)
  // Default: 128 - nonce_size_bits
  uint32 counter_bits = 3 [(buf.validate.field).uint32 = {gte: 1, lte: 128}];
}

// ChaCha20Poly1305Params defines parameters for ChaCha20-Poly1305 AEAD.
// CycloneDX pattern: ChaCha20-Poly1305 (IETF) or XChaCha20-Poly1305
// PKCS#11 Mechanisms: CKM_CHACHA20_POLY1305, CKM_XCHACHA20_POLY1305
// PKCS#11 Reference Structs: CK_CHACHA20_PARAMS, CK_SALSA20_CHACHA20_POLY1305_PARAMS
// Key size is always 256 bits for ChaCha20.
message ChaCha20Poly1305Params {
  // Nonce size in bits.
  // PKCS#11: CK_CHACHA20_PARAMS.ulNonceBits
  // IETF variant: 96 bits (12 bytes) - RFC 8439
  // Original DJB: 64 bits (8 bytes)
  // XChaCha variant: 192 bits (24 bytes) - extended nonce
  uint32 nonce_size_bits = 1 [(buf.validate.field).uint32 = {in: [64, 96, 192]}];
  
  // Block counter size in bits.
  // PKCS#11: CK_CHACHA20_PARAMS.blockCounterBits
  // IETF: 32 bits, Original: 64 bits
  uint32 block_counter_bits = 2 [(buf.validate.field).uint32 = {in: [32, 64]}];
  
  // Whether this is the extended nonce (XChaCha20) variant.
  // XChaCha20 allows random nonces without birthday bound concerns.
  bool extended_nonce = 3;
  
  // Cross-field validation: extended_nonce must match nonce_size
  option (buf.validate.message).cel = {
    id: "chacha20_nonce_consistency"
    message: "extended_nonce=true requires nonce_size_bits=192"
    expression: "!this.extended_nonce || this.nonce_size_bits == 192u"
  };
  
  // Cross-field validation: IETF uses 32-bit counter with 96-bit nonce
  option (buf.validate.message).cel = {
    id: "chacha20_ietf_counter"
    message: "IETF variant (96-bit nonce) requires 32-bit block counter"
    expression: "this.nonce_size_bits != 96u || this.block_counter_bits == 32u"
  };
}

