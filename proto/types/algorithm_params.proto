  // Ed448 always supports context; use empty bytes for "pure" mode.
  bytes context = 2 [(buf.validate.field).bytes.max_len = 255];
}

// RsaPssParams defines parameters for RSA-PSS signatures (PKCS#1 v2.1).
// CycloneDX pattern: RSA-PSS-{hash}-{saltLength}-{keyLength}
// PKCS#11 Mechanisms: CKM_RSA_PKCS_PSS, CKM_SHA256_RSA_PKCS_PSS, etc.
// PKCS#11 Reference Struct: CK_RSA_PKCS_PSS_PARAMS
message RsaPssParams {
  // Key size in bits. Required. Common: 2048, 3072, 4096.
