  // Special values:
  //   -1: Use hash output length (recommended, PSS default)
  //   -2: Maximum length (for verification only)
  //    0: No salt (not recommended)
  // Positive: Exact salt length in bytes
  int32 salt_length = 5 [(buf.validate.field).int32 = {gte: -2, lte: 512}];
