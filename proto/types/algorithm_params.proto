  uint32 prime_bits = 2 [(buf.validate.field).uint32 = {gte: 2048, lte: 8192}];
  
  // Key derivation function to apply to shared secret.
  // PKCS#11: CK_X9_42_DH_KDF_TYPE enum values
  enum KdfType {
    KDF_UNSPECIFIED = 0;
    KDF_NULL = 1;                  // CKD_NULL - Raw shared secret (z)
    KDF_SHA1_CONCATENATE = 2;      // CKD_SHA1_KDF_CONCATENATE - X9.42 KDF (legacy)
    KDF_SHA256_SP800 = 3;          // CKD_SHA256_KDF_SP800 - NIST SP 800-56A
    KDF_SHA384_SP800 = 4;          // CKD_SHA384_KDF_SP800
    KDF_SHA512_SP800 = 5;          // CKD_SHA512_KDF_SP800
  }
  KdfType kdf = 3;
  
  // Optional: private value length limiter (bits).
  // If set, private key exponent limited to this length.
  // PKCS#3 allows this for performance/compatibility.
  uint32 private_value_length_bits = 4;
}

// ============================================================================
// NIST SP 800-108 Key Derivation (Phase 1.4)
// PKCS#11 Reference: pkcs11-curr-v3.0 Section 2.35 (SP 800-108)
// ============================================================================

// Sp800108KdfParams defines parameters for NIST SP 800-108 KDF.
// CycloneDX pattern: SP800-108-{mode}-{prf}
// PKCS#11 Mechanisms: CKM_SP800_108_COUNTER_KDF, CKM_SP800_108_FEEDBACK_KDF,
//                     CKM_SP800_108_DOUBLE_PIPELINE_KDF
// PKCS#11 Reference Struct: CK_SP800_108_KDF_PARAMS, CK_SP800_108_FEEDBACK_KDF_PARAMS
message Sp800108KdfParams {
  // KDF mode.
  // PKCS#11: Determines mechanism selection
  enum Mode {
    MODE_UNSPECIFIED = 0;
    COUNTER = 1;           // CKM_SP800_108_COUNTER_KDF
    FEEDBACK = 2;          // CKM_SP800_108_FEEDBACK_KDF
    DOUBLE_PIPELINE = 3;   // CKM_SP800_108_DOUBLE_PIPELINE_KDF
  }
  Mode mode = 1 [(buf.validate.field).enum = {not_in: [0]}];
  
  // Pseudorandom function (PRF) type.
  // PKCS#11: CK_SP800_108_PRF_TYPE (uses mechanism types)
  enum PrfType {
    PRF_UNSPECIFIED = 0;
    PRF_HMAC_SHA1 = 1;       // HMAC-SHA1 (legacy)
    PRF_HMAC_SHA224 = 2;     // HMAC-SHA224
    PRF_HMAC_SHA256 = 3;     // HMAC-SHA256 (recommended)
    PRF_HMAC_SHA384 = 4;     // HMAC-SHA384
    PRF_HMAC_SHA512 = 5;     // HMAC-SHA512
    PRF_HMAC_SHA3_224 = 6;   // HMAC-SHA3-224
    PRF_HMAC_SHA3_256 = 7;   // HMAC-SHA3-256
    PRF_HMAC_SHA3_384 = 8;   // HMAC-SHA3-384
    PRF_HMAC_SHA3_512 = 9;   // HMAC-SHA3-512
    PRF_AES_CMAC = 10;       // AES-CMAC
    PRF_DES3_CMAC = 11;      // 3DES-CMAC
  }
  PrfType prf = 2 [(buf.validate.field).enum = {not_in: [0]}];
  
  // Derived key material length in bytes.
  uint32 derived_key_length_bytes = 3 [(buf.validate.field).uint32 = {gte: 16, lte: 512}];
  
  // Counter format (for COUNTER mode only).
  // PKCS#11: CK_SP800_108_COUNTER_FORMAT
  message CounterFormat {
    bool little_endian = 1;  // Byte order (false = big endian)
    uint32 width_bits = 2 [(buf.validate.field).uint32 = {in: [8, 16, 24, 32]}];
  }
  CounterFormat counter_format = 4;
  
  // Initial value for FEEDBACK mode.
  // PKCS#11: CK_SP800_108_FEEDBACK_KDF_PARAMS.pIV
  // Required when mode = FEEDBACK, optional otherwise.
  // Length should match PRF output length.
  uint32 iv_length_bytes = 5;
}

// ============================================================================
// TLS 1.2 Key Derivation (Phase 1.5)
// PKCS#11 Reference: pkcs11-curr-v3.0 Section 2.33 (TLS)
// ============================================================================

// Tls12Params defines parameters for TLS 1.2 cryptographic mechanisms.
// CycloneDX pattern: TLS12-{operation}-{prfHash}
// PKCS#11 Mechanisms: CKM_TLS12_MASTER_KEY_DERIVE, CKM_TLS12_KEY_AND_MAC_DERIVE,
//                     CKM_TLS12_KDF, CKM_TLS12_MAC
// PKCS#11 Reference Structs: CK_TLS12_MASTER_KEY_DERIVE_PARAMS, CK_TLS12_KEY_MAT_PARAMS,
//                            CK_SSL3_RANDOM_DATA
message Tls12Params {
  // TLS operation type.
  // PKCS#11: Determines mechanism selection
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    MASTER_KEY_DERIVE = 1;       // CKM_TLS12_MASTER_KEY_DERIVE
    KEY_AND_MAC_DERIVE = 2;      // CKM_TLS12_KEY_AND_MAC_DERIVE
    KDF = 3;                     // CKM_TLS12_KDF (RFC 5705 exporter)
    MAC = 4;                     // CKM_TLS12_MAC (Finished message)
  }
  Operation operation = 1 [(buf.validate.field).enum = {not_in: [0]}];
  
  // PRF hash mechanism.
  // TLS 1.2 requires explicit PRF: SHA-256 (default) or SHA-384.
  // PKCS#11: CK_TLS12_MASTER_KEY_DERIVE_PARAMS.prfHashMechanism
  HashAlgorithm prf_hash = 2 [(buf.validate.field).enum = {in: [0, 1, 2]}];  // UNSPEC, SHA256, SHA384
  
  // RandomInfo from TLS handshake.
  // PKCS#11: CK_SSL3_RANDOM_DATA embedded in TLS12 params
  message RandomInfo {
    // Client random value (32 bytes).
    // PKCS#11: CK_SSL3_RANDOM_DATA.pClientRandom (ulClientRandomLen = 32)
    uint32 client_random_length = 1 [(buf.validate.field).uint32.const = 32];
    
    // Server random value (32 bytes).
    // PKCS#11: CK_SSL3_RANDOM_DATA.pServerRandom (ulServerRandomLen = 32)
    uint32 server_random_length = 2 [(buf.validate.field).uint32.const = 32];
  }
  RandomInfo random_info = 3;
  
  // For KEY_AND_MAC_DERIVE: cipher suite parameters.
  // PKCS#11: CK_TLS12_KEY_MAT_PARAMS fields
  message KeyMaterialParams {
    uint32 mac_size_bits = 1;    // ulMacSizeInBits
    uint32 key_size_bits = 2;    // ulKeySizeInBits
    uint32 iv_size_bits = 3;     // ulIVSizeInBits
  }
  KeyMaterialParams key_material = 4;
}

// ============================================================================
// CMAC (Cipher-based MAC) (Phase 1.6)
// PKCS#11 Reference: pkcs11-curr-v3.0 Section 2.9 (AES), 2.10 (DES)
// ============================================================================

// CmacParams defines parameters for CMAC (NIST SP 800-38B).
// CycloneDX pattern: {cipher}-CMAC-{outputBits}
// PKCS#11 Mechanisms: CKM_AES_CMAC, CKM_AES_CMAC_GENERAL, CKM_DES3_CMAC, CKM_DES3_CMAC_GENERAL
// PKCS#11 Reference: CK_MAC_GENERAL_PARAMS (for GENERAL variants)
message CmacParams {
  // Block cipher for CMAC.
  // PKCS#11: CKM_AES_CMAC (128-bit block) or CKM_DES3_CMAC (64-bit block)
  enum BlockCipher {
    BLOCK_CIPHER_UNSPECIFIED = 0;
    AES = 1;       // AES-CMAC (128-bit block, recommended)
    DES3 = 2;      // 3DES-CMAC (64-bit block, legacy)
  }
  BlockCipher cipher = 1 [(buf.validate.field).enum = {not_in: [0]}];
  
  // Key size in bits.
  // AES: 128, 192, or 256 bits
  // 3DES: 128 (2-key) or 192 (3-key) bits
  uint32 key_size_bits = 2 [(buf.validate.field).uint32 = {in: [128, 192, 256]}];
  
  // Output tag length in bits.
  // 0 = full block size (128 for AES, 64 for 3DES)
  // PKCS#11: CK_MAC_GENERAL_PARAMS for custom output length
  // Must not exceed cipher block size.
  uint32 output_bits = 3;
  
  // Cross-field validation: output_bits ≤ cipher block size
  option (buf.validate.message).cel = {
    id: "cmac_output_vs_cipher"
    message: "CMAC output must not exceed cipher block size (128 for AES, 64 for 3DES)"
    expression: "(this.cipher == 1 && (this.output_bits <= 128u || this.output_bits == 0u)) || (this.cipher == 2 && (this.output_bits <= 64u || this.output_bits == 0u))"
  };
}

// ============================================================================
// AES Additional Modes (Phase 1.7)
// PKCS#11 Reference: pkcs11-curr-v3.0 Section 2.9 (AES)
// ============================================================================

// AesCcmParams defines parameters for AES-CCM (Counter with CBC-MAC).
// CycloneDX pattern: AES-{keyLength}-CCM-{tagLength}
// PKCS#11 Mechanism: CKM_AES_CCM
// PKCS#11 Reference Struct: CK_CCM_PARAMS
message AesCcmParams {
  // Key size in bits.
  // PKCS#11: CKA_VALUE_LEN = 16, 24, or 32 bytes
  uint32 key_size_bits = 1 [(buf.validate.field).uint32 = {in: [128, 192, 256]}];
  
  // Nonce length in bytes (7-13 bytes per NIST SP 800-38C).
  // PKCS#11: CK_CCM_PARAMS.ulNonceLen (7-13)
  // Trade-off: longer nonce = shorter max message
  //   13 bytes nonce → 2 bytes counter (max 64KB message)
  //   7 bytes nonce → 8 bytes counter (max 16 EB message)
  uint32 nonce_size_bytes = 2 [(buf.validate.field).uint32 = {gte: 7, lte: 13}];
  
  // MAC tag length in bytes.
  // PKCS#11: CK_CCM_PARAMS.ulMACLen (4, 6, 8, 10, 12, 14, 16)
  // Per NIST SP 800-38C: only these even values are valid.
  uint32 tag_size_bytes = 3 [(buf.validate.field).uint32 = {in: [4, 6, 8, 10, 12, 14, 16]}];
}

// AesXtsParams defines parameters for AES-XTS (XEX-based Tweaked Codebook mode).
// CycloneDX pattern: AES-{keyLength}-XTS
// PKCS#11 Mechanism: CKM_AES_XTS
// PKCS#11 Key Type: CKK_AES_XTS
// PKCS#11 Reference Struct: CK_AES_XTS_PARAMS
// Primary use case: Disk/storage encryption
message AesXtsParams {
  // Key size in bits (total for both XTS keys).
  // NOTE: AES-XTS uses TWO keys internally (key1 || key2)
  // PKCS#11: CKA_VALUE = 32 bytes (AES-128-XTS) or 64 bytes (AES-256-XTS)
  // "AES-256-XTS" means 512-bit total key (2 × 256-bit keys)
  uint32 key_size_bits = 1 [(buf.validate.field).uint32 = {in: [256, 512]}];
  
  // Tweak (sector address) size in bytes.
  // PKCS#11: CK_AES_XTS_PARAMS.ulTweakLen (typically 16)
  // Per NIST SP 800-38E: Tweak is 128 bits (16 bytes)
  uint32 tweak_size_bytes = 2 [(buf.validate.field).uint32.const = 16];
  
  // Data unit size in bytes (optional).
  // PKCS#11: CK_AES_XTS_PARAMS.ulDataUnitLen
  // 0 = single data unit, 512/4096 = common sector sizes
  uint32 data_unit_size_bytes = 3;
}

// Poly1305Params defines parameters for standalone Poly1305 authenticator.
// CycloneDX pattern: Poly1305
// Note: Usually combined with ChaCha20, but PKCS#11 allows standalone.
// Key: 256 bits (32 bytes), Output: 128 bits (16 bytes)
// WARNING: One-time authenticator - key/nonce must NEVER repeat
message Poly1305Params {
  // Poly1305 has fixed parameters - this message exists for API consistency.
  // Key size is always 256 bits (32 bytes)
  // Output is always 128 bits (16 bytes)
}

