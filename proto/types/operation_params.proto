syntax = "proto3";

package caas.crypto.v1;

option go_package = "github.ibm.com/citius/api/gen/go/types;types";

import "google/protobuf/struct.proto";
import "google/protobuf/any.proto";
import "types/algorithm_params.proto";
import "buf/validate/validate.proto";

// ============================================================================
// Operation-Time Parameters
// ============================================================================
//
// This file defines user-provided parameters that must be supplied during
// cryptographic operations. These are distinct from:
//   - Template parameters (algorithm_params.proto): Set at key creation time
//   - System-generated values (IV, nonce): Generated by the system
//
// These parameters CANNOT be system-generated and represent application-specific
// data that only the caller can provide.
//
// Design Pattern:
// Each operation type uses a `oneof` field to group algorithm-specific parameters.
// An explicit empty marker message (e.g., NoEncryptionParams) is used for algorithms
// that don't require user-provided parameters, making intent explicit and
// distinguishing "forgot to set" from "intentionally no params needed".
// ============================================================================

// ============================================================================
// Shared Scope Marker
// ============================================================================

// Generic no-params marker for scopes that need no user-provided parameters.
// Use for:
//   Encryption: AES-CBC, AES-CTR, RSA-PKCS1v15, ChaCha20 (non-AEAD), 3DES, Blowfish
//   Signing:    ECDSA, RSA-PSS, RSA-PKCS1v15, DSA, GOST R 34.10-2012
//   MAC:        HMAC-SHA*, CMAC, GMAC, Poly1305
//   Wrapping:   AES-KW, AES-KWP, RSA key wrap
//
// SECURITY WARNING (encryption scope): Algorithms using NoParams for encryption
// (AES-CBC, AES-CTR, 3DES, Blowfish) do NOT provide authentication or integrity
// protection. Use AEAD algorithms (AES-GCM, ChaCha20-Poly1305) via
// AeadEncryptParams instead. If legacy modes are required, pair with a
// separate MAC operation (GenerateMAC/VerifyMAC) for integrity protection.
message NoParams {}

// ============================================================================
// Encryption Scope Parameters
// ============================================================================

// AEAD scope parameters for authenticated encryption.
// Scope: AEAD (AES-GCM, AES-CCM, ChaCha20-Poly1305, AES-GCM-SIV)
//
// DETERMINISTIC AEAD NOTE (AEAD_SCOPE_DETERMINISTIC):
// When used with deterministic AEAD algorithms (AES-SIV, AES-GCM-SIV with
// external nonce), AAD SHOULD be non-empty for meaningful domain separation.
// Server implementations MUST reject empty AAD for deterministic AEAD scope
// if the policy requires it. Schema-level enforcement is intentionally omitted
// because the same AeadEncryptParams is shared with randomized AEAD scopes
// where empty AAD is legitimate.
message AeadEncryptParams {
  // Additional Authenticated Data - user-provided, cannot be system-generated.
  // Authenticated but not encrypted (e.g., packet headers, metadata).
  // Optional - empty AAD is valid for most AEAD modes.
  bytes aad = 1;
  
  // CCM-specific: Total plaintext length in bytes.
  // REQUIRED for streaming CCM operations (CCM needs length upfront for tag computation).
  // For single-shot operations, can be derived from plaintext field if not set.
  optional uint64 plaintext_length = 2;
}

// Storage encryption scope parameters for disk/sector encryption.
// Scope: XTS (AES-XTS, IEEE 1619)
message XtsEncryptParams {
  // Sector/data unit number - REQUIRED.
  // Identifies the logical position of the data unit being encrypted.
  // Must be exactly 16 bytes (128 bits) - typically sector number or block address.
  // The tweak provides positional uniqueness without requiring unique keys per sector.
  bytes tweak = 1 [(buf.validate.field).bytes.len = 16];
}

// Asymmetric encryption scope parameters.
// Scope: PKE (RSA-OAEP and other asymmetric encryption)
message AsymmetricEncryptParams {
  // Optional label for OAEP encoding (called "label" in PKCS#1 v2.2, "pSourceData" in PKCS#11).
  // Empty byte string is the default per PKCS#1 v2.2.
  // Used for domain separation in some protocols.
  // Must match during decryption.
  bytes label = 1;
}

// ============================================================================
// Signature Scope Parameters
// ============================================================================

// Unified context for signature algorithms supporting domain separation.
// Scope: Context-bearing signatures (EdDSA, ML-DSA, SLH-DSA)
//
// These algorithms all share the same operational parameter: a context byte
// string (0-255 bytes) for domain separation. Rather than separate per-algorithm
// messages, this single scope-based message serves all of them.
//
// PKCS#11 Reference:
//   - CK_EDDSA_PARAMS.pContextData, ulContextDataLen (EdDSA)
//   - CK_ML_DSA_PARAMS.pContext, ulContextLen (ML-DSA)
//   - CK_SLH_DSA_PARAMS.pContext, ulContextLen (SLH-DSA)
message SignatureDomainContext {
  // Domain separation context (0-255 bytes).
  // Used to separate signatures across different protocols/applications.
  // Empty context is valid and is the default for most algorithms.
  // Ed448 REQUIRES context (can be empty but must be explicitly set).
  // Max 255 bytes per RFC 8032 -5.2.6 (Ed448), FIPS 204 -3.2 (ML-DSA),
  // FIPS 205 -9.2 (SLH-DSA).
  bytes context = 1 [(buf.validate.field).bytes.max_len = 255];
}

// ============================================================================
// Key Derivation Operation Parameters
// ============================================================================

// Note: Unlike encryption/signing, ALL KDFs require some form of user input,
// so there is no "NoKdfParams" marker. Each KDF has its specific requirements.

// Salt source type for HKDF.
// PKCS#11 Reference: CK_HKDF_PARAMS.ulSaltType
enum HkdfSaltType {
  // Unspecified — server selects default (typically SALT_TYPE_DATA).
  HKDF_SALT_TYPE_UNSPECIFIED = 0;

  // Salt is provided as raw bytes in the salt field.
  // PKCS#11: CKF_HKDF_SALT_DATA
  HKDF_SALT_TYPE_DATA = 1;

  // No salt — equivalent to a string of zeros of length HashLen (RFC 5869 -2.2).
  // PKCS#11: CKF_HKDF_SALT_NULL
  HKDF_SALT_TYPE_NULL = 2;

  // Salt is derived from another key (identified by name/handle).
  // PKCS#11: CKF_HKDF_SALT_KEY — CK_HKDF_PARAMS.hSaltKey
  // The salt_key_name field in HkdfOperationParams provides the key reference.
  HKDF_SALT_TYPE_KEY = 3;
}

// HKDF parameters (RFC 5869).
// Use for: HKDF-SHA256, HKDF-SHA384, HKDF-SHA512, HKDF-SHA3-*
//
// PKCS#11 Reference: CK_HKDF_PARAMS.pSalt, CK_HKDF_PARAMS.pInfo
message HkdfOperationParams {
  // Salt for Extract phase.
  // When not set (field absence), the server SHOULD generate a random salt
  // per RFC 5869: "a non-secret random value".
  // When set to empty bytes (b""), treated as intentionally empty — server uses
  // a string of zeros of length HashLen per RFC 5869 -2.2.
  // For deterministic derivation, caller should provide explicit salt.
  optional bytes salt = 1;
  
  // Application-specific context for Expand phase - USER-PROVIDED.
  // Per RFC 5869: "application specific context and target length info".
  // This differentiates derived keys for different purposes.
  // Example: "client-write-key", "server-write-key", "iv-material"
  bytes info = 2;

  // Salt source type — controls how the salt field is interpreted.
  // PKCS#11: CK_HKDF_PARAMS.ulSaltType
  // Default (UNSPECIFIED): treated as SALT_TYPE_DATA if salt is set,
  // SALT_TYPE_NULL if salt is absent.
  HkdfSaltType salt_type = 3;

  // Key name for salt-from-key mode (HKDF_SALT_TYPE_KEY).
  // PKCS#11: CK_HKDF_PARAMS.hSaltKey
  // Only used when salt_type = HKDF_SALT_TYPE_KEY. The referenced key's
  // raw value is used as the HKDF salt in the Extract phase.
  string salt_key_name = 4;
}

// PBKDF2 parameters (RFC 8018).
// Use for: PBKDF2-HMAC-SHA256, PBKDF2-HMAC-SHA512, etc.
//
// PKCS#11 Reference: CK_PKCS5_PBKD2_PARAMS2.pPassword, CK_PKCS5_PBKD2_PARAMS2.pSaltSourceData
//
// NOTE: The following PBKDF2 cost parameters are TEMPLATE-LEVEL (set at key
// creation time in Pbkdf2Params within algorithm_params.proto) and are NOT
// repeated here:
//   - iteration_count: Number of PBKDF2 iterations
//   - hash_algorithm: PRF hash function (HMAC-SHA256, HMAC-SHA512, etc.)
//   - output_length: Derived key length in bytes
// These are fixed per-template to ensure consistent derivation across operations.
message Pbkdf2OperationParams {
  // User password - REQUIRED, cannot be system-generated.
  // This is the secret input from which the key is derived.
  bytes password = 1;
  
  // Salt - when not set (field absence), the server SHOULD generate a random salt.
  // When set to empty bytes (b""), treated as intentionally empty (NOT RECOMMENDED).
  // Should be at least 16 bytes (128 bits) per NIST SP 800-132 -5.1.
  // For password storage, use unique salt per password.
  optional bytes salt = 2;
}

// Argon2 parameters (RFC 9106).
// Use for: Argon2id, Argon2i, Argon2d
//
// Note: Argon2 is not in PKCS#11 v3.0, but included for completeness.
//
// NOTE: The following Argon2 cost parameters are TEMPLATE-LEVEL (set at key
// creation time in Argon2Params within algorithm_params.proto) and are NOT
// repeated here:
//   - variant: Argon2 variant (Argon2d, Argon2i, Argon2id)
//   - memory_cost_kib: Memory size in KiB
//   - time_cost: Number of iterations (passes)
//   - parallelism: Degree of parallelism (lanes)
//   - output_length: Derived key length in bytes
// These are fixed per-template to ensure consistent cost across operations.
message Argon2OperationParams {
  // User password - REQUIRED.
  bytes password = 1;
  
  // Salt - when not set (field absence), the server SHOULD generate a random salt.
  // When set to empty bytes (b""), treated as intentionally empty (NOT RECOMMENDED).
  // Should be at least 16 bytes (128 bits) per RFC 9106 §3.1.
  optional bytes salt = 2;
  
  // Optional associated data (Argon2-specific "additional data" parameter).
  // Bound to the derived key but not secret.
  bytes associated_data = 3;
  
  // Optional secret value (pepper).
  // A secret value independent of the password, typically stored separately.
  bytes secret = 4;
}

// ECDH/X25519/X448 key agreement parameters.
// Use for: ECDH (P-256, P-384, P-521), X25519, X448
//
// PKCS#11 Reference: CK_ECDH1_DERIVE_PARAMS.pSharedData
message EcdhOperationParams {
  // Shared info for KDF (PartyU/PartyV info).
  // Per NIST SP 800-56A: additional context for key derivation.
  // Often contains AlgorithmID, PartyUInfo, PartyVInfo per SP 800-56A Concat KDF.
  // Optional - empty shared_info uses just the shared secret as KDF input.
  bytes shared_info = 1;
}

// X9.42 DH key agreement parameters (classic Diffie-Hellman).
// Use for: DH key agreement with X9.42 KDF
//
// PKCS#11 Reference: CK_X9_42_DH_KDF_PARAMS.pOtherInfo
message X942DhOperationParams {
  // OtherInfo for KDF per ANSI X9.42.
  // Contains algorithm identifier and additional keying material context.
  bytes other_info = 1;
}

// TLS PRF parameters (TLS 1.0/1.1).
// Use for: TLS 1.0/1.1 PRF for key expansion
//
// PKCS#11 Reference: CK_TLS_PRF_PARAMS.pLabel, CK_TLS_PRF_PARAMS.pSeed
message TlsPrfOperationParams {
  // PRF label string — protocol-defined ASCII string identifying the derivation purpose.
  // Standard label values (RFC 5246 §8.1, RFC 5705):
  //   - "master secret"     — TLS master secret derivation (8.1)
  //   - "key expansion"     — TLS key material generation (6.3)
  //   - "client finished"   — Client Finished verify_data (7.4.9)
  //   - "server finished"   — Server Finished verify_data (7.4.9)
  //   - "EXPORTER-*"        — RFC 5705 keying material export (application-defined suffix)
  // Custom labels MUST NOT collide with the "EXPORTER-" prefix convention.
  bytes label = 1;
  
  // PRF seed data.
  // For master secret: ClientHello.random + ServerHello.random
  // For key expansion: server_random + client_random
  bytes seed = 2;
}

// TLS 1.2 KDF parameters.
// Use for: TLS 1.2 key derivation (uses HMAC-based PRF)
//
// PKCS#11 Reference: CK_TLS_KDF_PARAMS, CK_TLS12_KEY_MAT_PARAMS.RandomInfo
message Tls12KdfOperationParams {
  // Label string for PRF.
  bytes label = 1;
  
  // Client random from TLS handshake (exactly 32 bytes per RFC 5246 -7.4.1.2).
  bytes client_random = 2 [(buf.validate.field).bytes.len = 32];
  
  // Server random from TLS handshake (exactly 32 bytes per RFC 5246 -7.4.1.2).
  bytes server_random = 3 [(buf.validate.field).bytes.len = 32];
  
  // Additional context data (for extended master secret, etc.).
  bytes context_data = 4;
}

// SP 800-108 KDF parameters (Counter/Feedback/Pipeline modes).
// Use for: NIST SP 800-108 compliant key derivation
//
// PKCS#11 Reference: CK_SP800_108_KDF_PARAMS.pDataParams
message Sp800108OperationParams {
  // Data parameters array (label, context, counter position, etc.).
  // The order and content of these parameters defines the PRF input structure.
  repeated Sp800108DataParam data_params = 1;
}

// Individual data parameter for SP 800-108 KDF.
// PKCS#11 Reference: CK_PRF_DATA_PARAM
message Sp800108DataParam {
  // Type of this data parameter.
  Sp800108DataType type = 1;
  
  // Value for this parameter (interpretation depends on type).
  bytes value = 2;
}

// Data parameter types for SP 800-108 KDF.
// PKCS#11 Reference: CK_SP800_108_PRF_DATA_PARAM_TYPE
enum Sp800108DataType {
  SP800_108_DATA_TYPE_UNSPECIFIED = 0;
  
  // Iteration variable (counter) position marker.
  // Value field indicates byte width (typically 4 bytes).
  SP800_108_DATA_TYPE_ITERATION_VARIABLE = 1;
  
  // Explicit counter value (rarely used, counter usually auto-incremented).
  SP800_108_DATA_TYPE_COUNTER = 2;
  
  // Derived key material length in bits.
  // Encoded as big-endian integer in value field.
  SP800_108_DATA_TYPE_DKM_LENGTH = 3;
  
  // Byte array data (label, context, separator, fixed data).
  // The value field contains the literal bytes.
  SP800_108_DATA_TYPE_BYTE_ARRAY = 4;
}

// GOST key derivation parameters.
// Use for: GOST R 34.10-2012 key agreement and derivation
//
// PKCS#11 Reference: CK_GOSTR3410_DERIVE_PARAMS.pUKM
message GostKdfOperationParams {
  // User Keying Material - typically REQUIRED for GOST protocols.
  // UKM provides additional entropy and prevents key reuse attacks.
  // Size depends on the underlying algorithm:
  //   - GOST 28147-89 (CKM_GOSTR3410_DERIVE): 8 bytes (64 bits)
  //   - GOST R 34.12-2015 Magma/Kuznyechik: 8 bytes typical
  //   - RFC 4357 -5.2 (VKO GOST R 34.10-2001): 8 bytes mandatory
  //   - RFC 7836 -4.3 (VKO GOST R 34.10-2012): 1–64 bytes
  // Server implementations SHOULD validate UKM size against the algorithm.
  bytes ukm = 1;
}

// X3DH (Signal Protocol) parameters.
// Use for: Extended Triple Diffie-Hellman key agreement
//
// Note: X3DH is not in PKCS#11 v3.0, but included for modern messaging protocols.
//
// X3DH Key Resolution:
// The X3DH protocol involves multiple key pairs (identity key, signed pre-key,
// one-time pre-key). Resolution of these keys is handled at the request level:
//   - The private_key_name in KeyAgreementRequest identifies the local identity key
//   - The peer_public_key carries the recipient's identity key (IK_B)
//   - Additional keys (SPK_B, OPK_B) are resolved by the server from the
//     recipient's published key bundle, or provided via context
//
// Applications SHOULD encode the X3DH role (initiator/responder) and key
// bundle version in the context field for reproducible agreement.
message X3dhOperationParams {
  // Protocol-specific context for the X3DH exchange.
  // May include application identifier, version info, peer key bundle
  // references, or role designation (initiator/responder).
  bytes context = 1;
}

// ============================================================================
// Key Wrapping Scope Parameters
// ============================================================================

// Key-agreement-based wrapping scope parameters.
// Scope: ECDH-ES+AES-KW, ECMQV key agreement with wrapping
//
// JWE ECDH-ES Integration (RFC 7518 - 4.6):
// When used with JWE ECDH-ES+AES-KW, the apu and apv fields map to the
// "apu" and "apv" header parameters. The shared_info field can carry
// additional KDF context beyond what apu/apv provide.
message KeyAgreementWrapParams {
  // Shared info for KDF in key wrapping.
  // Per NIST SP 800-56A: additional context for key derivation in wrap context.
  bytes shared_info = 1;

  // Agreement PartyUInfo (RFC 7518 - 4.6.2).
  // Identifies the originator (producer) of the JWE.
  // Used in Concat KDF (NIST SP 800-56A) as part of OtherInfo.
  // base64url-decoded value of the JWE "apu" header parameter.
  bytes apu = 2;

  // Agreement PartyVInfo (RFC 7518 - 4.6.2).
  // Identifies the recipient (consumer) of the JWE.
  // Used in Concat KDF (NIST SP 800-56A) as part of OtherInfo.
  // base64url-decoded value of the JWE "apv" header parameter.
  bytes apv = 3;
}

// GOST key wrapping parameters.
// Use for: GOST 28147-89 key wrapping, GOST R 34.12-2015 key wrapping
//
// PKCS#11 Reference: CK_GOSTR3410_KEY_WRAP_PARAMS.pUKM
message GostWrapOperationParams {
  // User Keying Material for GOST key wrapping.
  bytes ukm = 1;
}

// ============================================================================
// MAC Scope Parameters
// ============================================================================

// Customizable MAC scope parameters for KMAC (NIST SP 800-185).
// Scope: KMAC128, KMAC256, KMACXOF128, KMACXOF256
//
// KMAC customization provides domain separation without affecting the key.
message CustomizableMacParams {
  // Customization string for domain separation.
  // Per NIST SP 800-185: "an optional customization bit string of any length".
  // Used to differentiate KMAC instances for different applications.
  // Empty customization is valid and represents the "default" KMAC.
  bytes customization = 1;
}

// ============================================================================
// Custom/Vendor Operation Parameters
// ============================================================================
//
// These messages provide extensibility for vendor-specific or custom algorithms
// that use KEY_TYPE_VENDOR, KEY_TYPE_PQ_EXPERIMENTAL, or KEY_TYPE_CUSTOM.
// They complement CustomAlgorithm in algorithm_params.proto.
//
// Use cases:
// - HSM vendor's proprietary algorithm operation parameters
// - Pre-standard PQC algorithms with unique operation requirements
// - Custom hybrid schemes with specific operation-time inputs
//
// IMPORTANT: Implementations SHOULD validate custom parameters against
// an allow-list in policy configuration.

// CustomOperationParams provides an escape hatch for operation-time parameters
// for vendor-specific or custom algorithms.
//
// Example for a vendor-specific AEAD with custom fields:
//   CustomOperationParams {
//     vendor: "thales"
//     algorithm_name: "LUNA-AEAD-256"
//     generic_params: {"header_version": 2, "include_timestamp": true}
//   }
//
// Example for pre-standard PQ KEM operation:
//   CustomOperationParams {
//     vendor: "pqcrypto"
//     algorithm_name: "Classic-McEliece-6960119"
//     generic_params: {"decapsulation_mode": "implicit_rejection"}
//   }
message CustomOperationParams {
  // Vendor identifier (e.g., "thales", "entrust", "aws", "ibm").
  // Empty string for non-vendor-specific custom algorithms.
  string vendor = 1;
  
  // Algorithm name this params applies to.
  // Should match CustomAlgorithm.name in the key's template.
  string algorithm_name = 2;
  
  // Operation parameters.
  // Use generic_params for simple cases, typed_params for vendor-defined messages.
  oneof params {
    // Unstructured parameters as JSON-like key-value pairs.
    // Use for simple cases or unknown parameter sets.
    // Keys should follow lowercase_snake_case convention.
    google.protobuf.Struct generic_params = 10;
    
    // Strongly-typed parameters using Any.
    // Allows vendors to define their own parameter messages.
    // The type URL identifies the parameter message type.
    // Example: type.googleapis.com/vendor.crypto.CustomAeadOperationParams
    google.protobuf.Any typed_params = 11;
  }
  
  // Raw binary parameters for algorithms that require opaque blobs.
  // Use when the HSM/provider expects a specific binary format.
  //
  // Precedence when both structured and raw params are set:
  //   1. typed_params (highest) — strongly-typed, preferred by schema-aware providers
  //   2. generic_params — JSON-like, used when typed_params is not set
  //   3. raw_params — always passed through alongside structured params
  // raw_params is ADDITIVE: it is forwarded to the provider in addition to
  // whichever structured param (generic_params or typed_params) is set.
  // Providers that don't support raw_params MUST ignore it silently.
  bytes raw_params = 20;
}

// VendorEncryptionParams wraps CustomOperationParams for the encryption oneof.
// Provides type safety while allowing full flexibility for vendor algorithms.
message VendorEncryptionParams {
  CustomOperationParams params = 1;
}

// VendorSignatureContext wraps CustomOperationParams for the signature oneof.
// Provides type safety while allowing full flexibility for vendor algorithms.
message VendorSignatureContext {
  CustomOperationParams params = 1;
}

// VendorKdfParams wraps CustomOperationParams for the KDF oneof.
// Provides type safety while allowing full flexibility for vendor algorithms.
message VendorKdfParams {
  CustomOperationParams params = 1;
}

// VendorWrapParams wraps CustomOperationParams for the key wrap oneof.
// Provides type safety while allowing full flexibility for vendor algorithms.
message VendorWrapParams {
  CustomOperationParams params = 1;
}

// VendorMacParams wraps CustomOperationParams for the MAC oneof.
// Provides type safety while allowing full flexibility for vendor algorithms.
message VendorMacParams {
  CustomOperationParams params = 1;
}
