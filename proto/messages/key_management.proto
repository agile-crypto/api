syntax = "proto3";

package caas.crypto.v1;

option go_package = "github.ibm.com/citius/api/gen/go/messages;messages";

import "google/protobuf/timestamp.proto";
import "types/common.proto";
import "types/templates.proto";
import "types/implementation.proto";
import "types/providers.proto";
import "buf/validate/validate.proto";

// ============================================================================
// Key Management Messages
// ============================================================================

// CreateKeyRequest - Create a new cryptographic key
//
// Policy-Driven Algorithm Selection:
// The policy parameter specifies which security policy governs this key.
// The policy determines:
// - Which templates (algorithms) are allowed for the specified scope
// - Security levels and requirements (FIPS compliance, key sizes, etc.)
// - Which providers can operate on this key
// - Default algorithm selection preferences
//
// Scope vs Template Selection:
// - Scope-based: Client provides ScopeSpecification with typed properties
//   → Example: scope_spec.aead { scope: AEAD_SCOPE_STANDARD, security: { security_strength_bits: 256 } }
//   → Policy determines which template (e.g., "aes-256-gcm") to use
//   → Properties in scope_spec filter among policy-allowed templates
// - Template-based: Client explicitly specifies template_id (e.g., "ed25519")
//   → Policy must allow this template for the operation to proceed
//
// Example 1: Scope-based with security preference
//   CreateKeyRequest {
//     name: "app-encryption-key"
//     policy: "prod-encryption"
//     scope_spec: {
//       aead: {
//         scope: AEAD_SCOPE_STANDARD,
//         security: { security_strength_bits: 256, fips_approved: true }
//       }
//     }
//   }
//   → Policy allows: [aes-128-gcm, aes-256-gcm, chacha20-poly1305]
//   → Filter by security_strength_bits=256: [aes-256-gcm, chacha20-poly1305]
//   → Filter by fips_approved=true: [aes-256-gcm]
//
// Example 2: Post-quantum signature with non-malleability
//   CreateKeyRequest {
//     name: "signing-key"
//     policy: "signing-policy"
//     scope_spec: {
//       signature: {
//         scope: SIGNATURE_SCOPE_STANDARD,
//         security: { quantum_safe: true },
//         non_malleable: true
//       }
//     }
//   }
//   → Selects ML-DSA or SLH-DSA based on policy preferences
//
// Example 3: Explicit template selection
//   CreateKeyRequest {
//     name: "explicit-ed25519"
//     policy: "signing-policy"
//     template_id: "ed25519"
//   }
//   → Uses Ed25519 directly (policy must approve it)
//
// Example 4: Provider implementation requirements
//   CreateKeyRequest {
//     name: "high-assurance-key"
//     policy: "high-security"
//     scope_spec: { aead: { scope: AEAD_SCOPE_STANDARD } }
//     provider_requirements: {
//       fips_140_certified: true
//       min_fips_level: FIPS_140_LEVEL_3
//       constant_time: true
//     }
//   }
//   → Selects a FIPS Level 3 certified provider with constant-time impl
//
message CreateKeyRequest {
  // Unique name to identify this key
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
  // Name of the policy to bind this key to, for security governance
  string policy = 2;
  // Optional: provider ID in which the key must be created. If not set, the provider is 
  // auto-selected based on the policy and provider requirements, if set.
  string provider_id = 3;       
  // Optional: Ad-hoc provider-specific settings for this key creation only.
  //
  // PREFERRED: Use provider_requirements (field 7) for structured provider
  // selection, or provider_id referencing a pre-registered ProviderInstance.
  //
  // This field exists for lightweight deployments without pre-registered
  // provider instances. When both provider_id and provider_requirements are
  // specified, the provider_id must satisfy the requirements or the request
  // is rejected.
  //
  // NOTE: Ad-hoc configuration bypasses instance-level implementation property
  // tracking, which means CBOM generation and compliance reporting may be
  // incomplete. For production deployments, prefer pre-registered
  // ProviderInstances (managed via ProviderService).
  map<string, string> provider_configuration = 4;
  // Scope specification for template selection. The scope specification describes the 
  // scope (ie. cryptographic intent) and properties that the template must satisfy.
  // If a template is explicitly provided, the scope specification must at least 
  // include the scope to be associated with the key.
  ScopeSpecification scope_spec = 5;
  // Optional: explicit template ID. If set, it must match the scope specification
  // and be allowed by the policy. If not set, the template is determined based on
  // the scope specification and the policy.
  optional string template_id = 6;
  // Optional: Implementation requirements for provider selection.
  // When specified, only providers meeting these requirements are considered.
  //
  // Use cases:
  // - Require FIPS 140-3 certified implementation for compliance
  // - Require formally verified implementation for high-assurance
  // - Require constant-time implementation for side-channel resistance
  //
  // If provider_id is also specified, that provider must meet these requirements.
  ProviderRequirements provider_requirements = 7;

  // Optional cryptoperiod bounds (NIST SP 800-57 Part 1 §5.3).
  // If unset, defaults come from the governing policy (which SHOULD define
  // a maximum cryptoperiod). See KeyMetadata.activation_time/expiration_time
  // for enforcement semantics.
  optional google.protobuf.Timestamp activation_time = 8;
  optional google.protobuf.Timestamp expiration_time = 9;
}

message CreateKeyResponse {
  bool success = 1;
  string message = 2;
  KeyMetadata key_metadata = 3;
  // Security guarantees from the selected template (for audit trail)
  SecurityGuarantees security_guarantees = 4;
  
  // Implementation properties of the provider that created this key.
  // This captures the actual implementation characteristics used,
  // enabling accurate CBOM generation and compliance reporting.
  //
  // Example response:
  //   implementation_properties {
  //     fips_140 { certified: true, level: FIPS_140_LEVEL_3, certificate_number: "4282" }
  //     constant_time: true
  //     implementation_language: "C"
  //   }
  ImplementationProperties implementation_properties = 5;
}


message KeyMetadata {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
  uint32 version = 2;
  string key_id = 3; // Unique identifier for the key 
  string template_id = 4;
  // The scope specification used to create this key
  ScopeSpecification scope_spec = 5;
  string provider = 6;
  
  google.protobuf.Timestamp created_time = 7;
  google.protobuf.Timestamp updated_time = 8;
  string policy = 9;
  map<string, string> provider_metadata = 10;
  TemplateInfo template_info = 11;
  // Implementation properties of the provider (denormalized for convenience)
  ImplementationProperties implementation_properties = 12;
  // Whether the key material can be extracted from its provider.
  // False for non-extractable HSM keys.
  // Determines feasibility of EXTRACT_AND_IMPORT migration strategy.
  bool extractable = 13;
  // Lifecycle state of the key (NIST SP 800-57, KMIP state machine).
  KeyLifecycleState lifecycle_state = 14;
  optional bytes public_key_bytes = 15; // Public-key material for asymmetric keys
  optional KeyFormat public_key_format = 16; // Format of public key material (e.g., RAW, PKCS8, JWK)

  // Cryptoperiod (NIST SP 800-57 Part 1 §5.3): the time span during which
  // the key is authorized for use.
  //
  // Start of the key's originator-usage period. If unset, the key is usable
  // from creation. Keys before activation are in PRE_ACTIVE state.
  optional google.protobuf.Timestamp activation_time = 17;
  // End of the key's usage period. After expiration, protect operations
  // (encrypt, sign, wrap) MUST fail with CRYPTO_ERROR_KEY_EXPIRED; process
  // operations (decrypt, verify, unwrap) remain available per policy.
  // If unset, the key does not expire automatically (NOT RECOMMENDED —
  // policies SHOULD enforce a maximum cryptoperiod).
  optional google.protobuf.Timestamp expiration_time = 18;

  // How the key material came into existence (generated, imported, derived,
  // unwrapped). Immutable; set by the server at creation time.
  KeyOrigin origin = 19;
}

message ReadKeyRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
  optional uint32 version = 2; // Optional: specific version to read (default = latest)
}

message ReadKeyResponse {
  KeyMetadata key_metadata = 1;
}

message ListKeysRequest {
  // Optional: Filter by scope specification
  ScopeSpecification scope_spec = 1;
  string provider_id = 2;
  string policy = 3;
  // Optional: Filter by lifecycle state (e.g., only ACTIVE keys)
  KeyLifecycleState lifecycle_state = 4;
  // Pagination
  int32 page_size = 10;   // Max results per page (0 = server default = return all)
  string page_token = 11; // Opaque token from previous ListKeysResponse
}

message ListKeysResponse {
  repeated KeyMetadata keys = 1;
  // Opaque token for the next page. Empty if no more results.
  string next_page_token = 2;
}

// DeleteKeyRequest - Destroy a key's material (NIST SP 800-57 §8.3)
//
// Destruction semantics:
//   - Key material is ZEROIZED in the provider; this is irreversible.
//   - By default the key transitions to DESTROYED (or DESTROYED_COMPROMISED
//     if it was COMPROMISED) and its METADATA IS RETAINED for audit.
//   - Set remove_metadata=true to also remove the key record entirely
//     (permitted only where audit/retention policy allows).
message DeleteKeyRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];

  // If true, remove the key record (metadata) in addition to zeroizing
  // material. Default false: retain metadata in DESTROYED state for audit
  // per NIST SP 800-57 §8.3.
  bool remove_metadata = 2;
}

message DeleteKeyResponse {
  bool success = 1;
  string message = 2; // Status message (e.g., soft-delete confirmation, remaining reference warnings)
}

// RotateKeyRequest - Generate a new version of the key
//
// Rotation semantics:
//   - A new key version is generated with the SAME template and policy.
//   - Previous versions remain available for process operations (decrypt,
//     verify, unwrap) — see ReadKeyRequest.version — but new protect
//     operations use the latest version.
//   - To change algorithm during renewal, use TransformKey; to change
//     provider, use MigrateKey.
message RotateKeyRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];

  // Reason for rotation, recorded in the audit trail
  // (e.g., "scheduled", "suspected-compromise", "personnel-change").
  string reason = 2 [(buf.validate.field).string.max_len = 1024];
}

// UpdateKeyStateRequest - Explicit, auditable key lifecycle state transition
//
// NIST SP 800-57 Part 1 §7 requires explicit, auditable transitions between
// key states. This RPC covers transitions not implied by other operations:
//   PRE_ACTIVE  → ACTIVE        (activate)
//   ACTIVE      → SUSPENDED     (temporarily disable)
//   SUSPENDED   → ACTIVE        (reactivate)
//   ACTIVE      → DEACTIVATED   (retire from protect operations)
//   any         → COMPROMISED   (mark exposure; process ops per policy only)
//
// Destruction transitions (→ DESTROYED / DESTROYED_COMPROMISED) go through
// DeleteKey, which performs material zeroization.
//
// The server MUST validate the transition against the SP 800-57 / KMIP state
// machine and reject invalid transitions with
// CRYPTO_ERROR_INVALID_KEY_STATE_TRANSITION (e.g., COMPROMISED → ACTIVE,
// DESTROYED → anything).
message UpdateKeyStateRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];

  // Target lifecycle state. Required, must be a concrete state.
  KeyLifecycleState target_state = 2 [(buf.validate.field).enum = {
    defined_only: true,
    not_in: [0]
  }];

  // Reason for the transition, recorded in the audit trail.
  // REQUIRED for transitions to COMPROMISED (breach documentation).
  string reason = 3 [(buf.validate.field).string.max_len = 1024];
}

message UpdateKeyStateResponse {
  bool success = 1;
  string message = 2;
  KeyMetadata key_metadata = 3;
}

message RotateKeyResponse {
  bool success = 1;
  string message = 2;
  KeyMetadata new_key_metadata = 3;
}

// ExportKeyRequest - Export key material (if key's policy allows)
//
// SECURITY WARNING:
// Key export is a sensitive operation controlled by the key's associated policy.
// Exported keys leave the security boundary of the cryptographic service.
//
// Policy Governance:
// The key's existing policy determines whether export is allowed and may impose:
// - Export permission (allow_export: true/false)
// - Required wrapping (must wrap with KEK before export)
// - Allowed export formats
// - Audit requirements
//
// Export Formats:
// - RAW: Raw key bytes (highest risk, requires strict policy control)
// - WRAPPED: Key wrapped with a Key Encryption Key (recommended)
// - PKCS8: Standard PKCS#8 format for asymmetric keys
// - JWK: JSON Web Key format
message ExportKeyRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];                // Name of key to export (key's policy governs export)
  KeyFormat format = 2;           // Export format
  string wrapping_key_name = 3;   // Required if format=KEY_FORMAT_WRAPPED: KEK to wrap with
}

message ExportKeyResponse {
  bytes key_material = 1;       // Exported key (raw or wrapped based on format)
  KeyFormat format = 2;         // Format of exported key material
  KeyMetadata key_metadata = 3; // Metadata of exported key

  // Key check value for integrity verification of the exported material
  // (e.g., ANSI X9.24 KCV: leading bytes of encrypting a zero block, or an
  // HMAC/hash over the canonical key encoding — algorithm-dependent, and
  // documented by the provider). Allows the receiver to detect corruption
  // in transit or at rest before using the key. Optional but RECOMMENDED.
  bytes key_check_value = 4;
}

// ImportKeyRequest - Import key material into the service
//
// Policy Governance:
// The policy_name specifies the policy to associate with the imported key.
// This policy will govern all future operations on the imported key.
// The policy may also impose import-time requirements:
// - Specific import formats
// - Key attestation verification
// - Restrictions on imported key usage
message ImportKeyRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];              // Name for the imported key
  string policy_name = 2;       // Policy to associate with imported key
  bytes key_material = 3;       // Key material to import (raw or wrapped)
  KeyFormat format = 4;         // Import format
  string unwrapping_key_name = 5; // Required if format=KEY_FORMAT_WRAPPED: KEK to unwrap with
  string provider_id = 6;       // Optional: target provider for the key
  map<string, string> provider_configuration = 7;
  string template_id = 8;       // Template ID for the imported key (required)

  // Optional: attestation over the imported key material (BYOK).
  // Provider/vendor-specific evidence that the key was generated in a trusted
  // environment (e.g., HSM attestation blob, signed key provenance statement).
  // The governing policy may REQUIRE attestation for import; the server
  // verifies it before accepting the key. Imported keys are recorded with
  // KeyMetadata.origin = KEY_ORIGIN_IMPORTED regardless.
  bytes key_attestation = 9;
}

message ImportKeyResponse {
  bool success = 1;
  string message = 2;
  KeyMetadata key_metadata = 3;
}

// TransformKeyRequest - Change the template/algorithm of an existing key
//
// Policy-Driven Algorithm Selection:
// When using scope-based selection, the current policy determines which templates are allowed.
// Properties in the scope specification filter among policy-allowed options for the scope.
//
// Separate from UpdateKeyPolicy and MigrateKey to enable fine-grained access control:
// - Grant transform-only access: IAM can call TransformKey but not UpdateKeyPolicy/MigrateKey
// - This operation only changes the cryptographic template/scope, not governance or provider
//
// Key Retention:
// Whether to retain the existing key bytes (true) or regenerate (false)
// Use true when transforming only operation properties (e.g., signature hash algorithm)
// Use false when changing fundamental key characteristics (e.g., key size, algorithm family)
//
// EXAMPLES:
//   retain_key_bytes=true:
//     - ecdsa-p256-sha256 → ecdsa-p256-sha512 (same key, different hash)
//     - aes-128-cbc → aes-128-gcm (same key material, different mode)
//     - rsa-pss-2048-sha256 → rsa-pss-2048-sha512 (same RSA key, different hash)
//
//   retain_key_bytes=false (DEFAULT):
//     - aes-128-cbc → aes-256-gcm (different key size; must regenerate)
//     - ecdsa-p256-sha256 → ed25519 (different curve; must regenerate)
//     - ecdsa-p256 → ml-dsa-65 (different algorithm family; must regenerate)
//
// NOTE: If retain_key_bytes=true but transformation is incompatible with existing key,
// the service MUST reject the request with an error. Examples of incompatible transforms:
//   - Cannot retain bytes when key size changes (256-bit → 384-bit)
//   - Cannot retain bytes when algorithm family incompatible (RSA → ECDSA)
//   - Cannot retain bytes for different scopes requiring different key structures
//
// Example 1: Transform to higher security
//   TransformKeyRequest {
//     name: "legacy-signing-key"
//     retain_key_bytes: false
//     scope_spec: {
//       signature: {
//         scope: SIGNATURE_SCOPE_STANDARD,
//         security: { security_strength_bits: 256, quantum_safe: true }
//       }
//     }
//   }
//   → Current policy allows: [ecdsa-p256-sha256, ml-dsa-65, ml-dsa-87]
//   → Filter by security_strength_bits=256, quantum_safe=true
//   → Select ml-dsa-87 (highest security)
//
// Example 2: Transform for performance (explicit template)
//   TransformKeyRequest {
//     name: "encryption-key"
//     retain_key_bytes: false
//     template_id: "chacha20-poly1305"
//   }
//   → Transform to chacha20-poly1305
//
// Example 3: Transform keeping key bytes
//   TransformKeyRequest {
//     name: "signing-key"
//     retain_key_bytes: true
//     template_id: "ecdsa-p256-sha512"
//   }
//   → Current policy must allow "ecdsa-p256-sha512"
//   → Transform keeping existing key bytes
message TransformKeyRequest {
  // Name of the key to be transformed
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
  // Whether to retain the existing key bytes (true) or regenerate (false)
  bool retain_key_bytes = 2;
  // Scope specification for template selection. The scope specification describes the 
  // scope (ie. cryptographic intent) and properties that the template must satisfy.
  // If a template is explicitly provided, the scope specification must at least 
  // include the scope to be associated with the key.
  ScopeSpecification scope_spec = 3;
  // Optional: explicit template ID. If set, it must match the scope specification
  // and be allowed by the policy. If not set, the template is determined based on
  // the scope specification and the policy.
  optional string template_id = 4;
}

message TransformKeyResponse {
  bool success = 1;
  string message = 2;
  KeyMetadata key_metadata = 3;
}

// UpdateKeyPolicyRequest - Change policy for an existing key
// Separate from TransformKey to enable fine-grained access control:
// - Grant transform-only access: IAM can call TransformKey but not UpdateKeyPolicy
// - Grant policy-only access: Admins can call UpdateKeyPolicy for governance
//
// SECURITY NOTE:
// Changing policy may affect:
//   - Which templates are allowed for future transforms
//   - Which providers can operate on this key
//   - Compliance and security requirements
// This operation typically requires elevated privileges or admin approval.
message UpdateKeyPolicyRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
  string new_policy = 2 [(buf.validate.field).string = {min_len: 1, max_len: 256}];  // Policy name to assign to this key
}

message UpdateKeyPolicyResponse {
  bool success = 1;
  string message = 2;
  KeyMetadata key_metadata = 3;
}

// ============================================================================
// Key Migration Messages
// ============================================================================

// MigrationStrategy - Explicit strategy for provider migration
//
// User must explicitly choose a strategy based on:
// - Source and target provider types (software vs HSM)
// - Whether key bytes must be preserved
// - Security requirements for key transfer
// - Whether old key is needed for decryption
//
// See docs/TRANSFORM_KEY_PROVIDER_DESIGN.md for detailed decision tree.
enum MigrationStrategy {
  MIGRATION_STRATEGY_UNSPECIFIED = 0;
  
  // PROVIDER_SWITCH: Software-to-software only (metadata change)
  //
  // Use when: Both source and target are software providers
  // What happens: Only provider_id metadata is updated
  // Security: No key movement, trivial operation
  // Feasibility: Always works for SW→SW
  //
  // Example: go-crypto → openssl3 for FIPS compliance
  MIGRATION_STRATEGY_PROVIDER_SWITCH = 1;
  
  // EXTRACT_AND_IMPORT: Key crosses security boundary
  //
  // Use when: Moving between different security domains
  // What happens: Key bytes extracted from source, imported to target
  // Security: Key material temporarily in application memory
  // Feasibility: Requires source key to be extractable (E-YES)
  //
  // Examples:
  //   - Software → HSM (import to hardware)
  //   - HSM → Software (extract from hardware)
  //   - HSM → HSM (when wrapping not available)
  MIGRATION_STRATEGY_EXTRACT_AND_IMPORT = 2;
  
  // WRAPPED_TRANSFER: HSM-to-HSM with maximum security
  //
  // Use when: Moving between HSMs, maximum security required
  // What happens: Key wrapped by source HSM, unwrapped by target HSM
  // Security: Key never leaves HSM boundary in plaintext
  // Feasibility: Requires compatible HSMs with shared wrapping key
  //
  // Example: Production HSM → DR site HSM
  MIGRATION_STRATEGY_WRAPPED_TRANSFER = 3;
  
  // REKEY_AND_ARCHIVE: Generate new key, keep old for decryption
  //
  // Use when: Key rotation with backward compatibility needed
  // What happens: New key generated on target, old key archived
  // Security: Old key restricted to decrypt-only operations
  // Feasibility: ALWAYS works (universal fallback)
  //
  // Example: Post-quantum migration with existing ciphertexts
  MIGRATION_STRATEGY_REKEY_AND_ARCHIVE = 4;
  
  // REKEY_AND_DESTROY: Generate new key, destroy old key
  //
  // Use when: Clean break, no backward compatibility needed
  // What happens: New key generated on target, old key destroyed
  // Security: Old ciphertexts become unrecoverable
  // Feasibility: ALWAYS works
  //
  // WARNING: Use only after re-encrypting all data with new key!
  // Example: Decommissioning old provider completely
  MIGRATION_STRATEGY_REKEY_AND_DESTROY = 5;
}

// MigrateKeyRequest - Move key to different provider with explicit strategy
//
// Moves a key to a different provider with explicit migration strategy.
// User must choose how key material is handled during migration.
//
// Design Rationale (from TRANSFORM_KEY_PROVIDER_DESIGN.md):
// - Implicit provider switch assumes key bytes can be retained
// - This assumption fails for non-extractable HSM keys
// - Explicit strategy makes user acknowledge security implications
// - Separate from TransformKey to enable fine-grained IAM control
//
// Strategy Selection Guide:
// ┌─────────────────┬─────────────────┬────────────────────────┐
// │ Source Provider │ Target Provider │ Recommended Strategy   │
// ├─────────────────┼─────────────────┼────────────────────────┤
// │ Software        │ Software        │ PROVIDER_SWITCH        │
// │ Software        │ HSM             │ EXTRACT_AND_IMPORT     │
// │ HSM (extract)   │ Software        │ EXTRACT_AND_IMPORT     │
// │ HSM (no extract)│ Software        │ REKEY_AND_ARCHIVE      │
// │ HSM             │ HSM (compat)    │ WRAPPED_TRANSFER       │
// │ HSM             │ HSM (incompat)  │ EXTRACT_AND_IMPORT     │
// └─────────────────┴─────────────────┴────────────────────────┘
//
// Example 1: Software to software (FIPS compliance)
//   MigrateKeyRequest {
//     name: "encryption-key"
//     target_instance_id: "openssl3-fips-default"
//     strategy: MIGRATION_STRATEGY_PROVIDER_SWITCH
//   }
//
// Example 2: Software to HSM (security upgrade)
//   MigrateKeyRequest {
//     name: "signing-key"
//     target_instance_id: "hsm-prod-slot5"
//     strategy: MIGRATION_STRATEGY_EXTRACT_AND_IMPORT
//   }
//
// Example 3: HSM to HSM with maximum security
//   MigrateKeyRequest {
//     name: "root-key"
//     target_instance_id: "hsm-dr-site"
//     strategy: MIGRATION_STRATEGY_WRAPPED_TRANSFER
//   }
//
// Example 4: Migration with algorithm upgrade
//   MigrateKeyRequest {
//     name: "legacy-key"
//     target_instance_id: "new-provider"
//     strategy: MIGRATION_STRATEGY_REKEY_AND_ARCHIVE
//     template_id: "ml-dsa-65"  // Upgrade to post-quantum
//   }
message MigrateKeyRequest {
  // Name of the key to migrate
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
  
  // Target provider specification (exactly one required)
  oneof target {
    option (buf.validate.oneof).required = true;
    // Recommended: Use pre-configured ProviderInstance
    // Instance contains provider_id + configuration (library_path, slot, etc.)
    string target_instance_id = 2;
    
    // Alternative: Specify provider directly with configuration
    ProviderTarget provider_target = 3;
  }
  
  // REQUIRED: Explicit migration strategy
  // User must acknowledge how key material will be handled
  MigrationStrategy strategy = 4;
  
  // Optional: also change algorithm during migration with scope specification for template selection.
  // If not specified, current template is kept on target provider. The scope specification describes the 
  // scope (ie. cryptographic intent) and properties that the template must satisfy.
  // If a template is explicitly provided, the scope specification must at least 
  // include the scope to be associated with the key.
  optional ScopeSpecification scope_spec = 5;
  // Optional: also change algorithm with explicit template ID. If both a template ID and a scope specification are set, 
  // thee template ID must match the scope specification and be allowed by the policy. If only a scope specification is set, 
  // the template is determined based on the scope specification and the policy. If none are set, the current template is used.
  optional string template_id = 6;
}

// ProviderTarget - Direct provider specification for migration
//
// Use when target provider is not pre-registered as a ProviderInstance.
// Prefer using target_instance_id when provider is already configured.
message ProviderTarget {
  // Provider identifier (e.g., "pkcs11", "openssl3", "go-crypto")
  string provider_id = 1;
  
  // Provider-specific configuration
  // Examples:
  //   - PKCS#11: {"library_path": "/usr/lib/softhsm2.so", "slot_id": "0"}
  //   - Cloud KMS: {"project": "my-project", "location": "us-east1"}
  map<string, string> configuration = 2;
}

// MigrateKeyResponse - Result of key migration operation
message MigrateKeyResponse {
  bool success = 1;
  string message = 2;
  
  // Metadata of the key on the new provider
  KeyMetadata key_metadata = 3;
  
  // For REKEY_AND_ARCHIVE: Information about the archived key
  // The archived key has restricted permissions (decrypt-only)
  ArchivedKeyInfo archived_key_info = 4;
  
  // Details about what actually happened during migration
  MigrationResult result = 5;
}

// ArchivedKeyInfo - Information about an archived key after REKEY_AND_ARCHIVE
message ArchivedKeyInfo {
  // Name of the archived key (typically original_name + "_archived_" + timestamp)
  string archived_key_name = 1;
  
  // Original provider where archived key remains
  string provider_id = 2;
  
  // Restricted operations allowed on archived key
  repeated CryptoOperation allowed_operations = 3;  // e.g., [DECRYPT, UNWRAP_KEY]
  
  // When the archived key will be automatically deleted (null = never)
  google.protobuf.Timestamp expiration_time = 4;
}

// MigrationResult - Details of what happened during migration
message MigrationResult {
  // Strategy that was executed
  MigrationStrategy strategy_used = 1;
  
  // Whether original key bytes were preserved
  bool key_bytes_preserved = 2;
  
  // Source provider information (for audit)
  string source_provider_id = 3;
  string source_instance_id = 4;
  
  // Target provider information (for audit)
  string target_provider_id = 5;
  string target_instance_id = 6;
  
  // Implementation properties of new location
  ImplementationProperties target_implementation = 7;
  
  // For WRAPPED_TRANSFER: wrapping key used
  string wrapping_key_name = 8;
}

// ============================================================================
// Key Operation Validation Messages
// ============================================================================

// ValidateKeyOperationRequest - Check feasibility before committing
//
// Returns which operations/strategies are possible for a given key.
// Use this to:
// - Show users available options before they choose
// - Pre-validate operations in complex workflows
// - Build UIs with disabled/enabled options
message ValidateKeyOperationRequest {
  // Key to validate operations for
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
  
  // What the user wants to achieve
  oneof intent {
    option (buf.validate.oneof).required = true;
    ValidateTransformIntent transform = 2;
    ValidateMigrateIntent migrate = 3;
  }
}

// ValidateTransformIntent - Check transform feasibility
message ValidateTransformIntent {
  // Scope specification for template selection. The scope specification describes the 
  // scope (ie. cryptographic intent) and properties that the template must satisfy.
  // If a template is explicitly provided, the scope specification must at least 
  // include the scope to be associated with the key.
  ScopeSpecification scope_spec = 1;
  // Optional: explicit template ID. If set, it must match the scope specification
  // and be allowed by the policy. If not set, the template is determined based on
  // the scope specification and the policy.
  optional string template_id = 2;
  
  // Whether user prefers to retain key bytes
  bool prefer_retain_bytes = 3;
}

// ValidateMigrateIntent - Check migration feasibility
message ValidateMigrateIntent {
  // Target provider to validate against
  oneof target {
    string target_instance_id = 1;
    string target_provider_id = 2;
  }
  
  // Optional: specific strategy to validate
  MigrationStrategy preferred_strategy = 3;
}

// ValidateKeyOperationResponse - Feasibility report
//
// INTENT-DEPENDENT FIELDS: `options` and `recommended_strategy` are
// MigrationStrategy-typed and are populated for MIGRATE intents. For
// TRANSFORM intents, feasibility is reported via StrategyOption.feasible /
// infeasibility_reason with strategy = MIGRATION_STRATEGY_UNSPECIFIED
// (e.g., "retain_key_bytes not possible: key size changes"), and
// recommended_strategy remains UNSPECIFIED.
message ValidateKeyOperationResponse {
  // Current key state (for user's information)
  KeyState current_state = 1;
  
  // Available strategies with feasibility assessment
  repeated StrategyOption options = 2;
  
  // Recommended strategy based on current state
  MigrationStrategy recommended_strategy = 3;
  
  // Human-readable explanation of recommendation
  string recommendation_reason = 4;
}

// KeyState - Current state of a key for validation
message KeyState {
  string template_id = 1;
  string provider_id = 2;
  string instance_id = 3;
  bool extractable = 4;
  
  // Provider type classification
  ProviderType provider_type = 5;
  
  // Implementation properties
  ImplementationProperties implementation = 6;
}

// StrategyOption - Feasibility of a specific strategy
message StrategyOption {
  MigrationStrategy strategy = 1;
  
  // Is this strategy feasible?
  bool feasible = 2;
  
  // If not feasible, why?
  string infeasibility_reason = 3;
  
  // Security implications of using this strategy
  repeated string security_notes = 4;
  
  // Complexity/risk level (1-5, 1=trivial, 5=complex)
  int32 complexity_level = 5;
}
