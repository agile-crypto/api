syntax = "proto3";

package caas.crypto.v1;

option go_package = "github.ibm.com/citius/api/gen/go/messages;messages";

import "messages/metadata.proto";
import "messages/key_management.proto";
import "buf/validate/validate.proto";

// ============================================================================
// Key Encapsulation (Post-Quantum KEMs) Messages
// ============================================================================

message EncapsulateKeyRequest {
  string recipient_public_key_name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
  string shared_secret_name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
  string shared_secret_template_id = 3;
  
  // Optional: User-provided context for audit trail enrichment.
  map<string, string> user_context = 15;
}

message EncapsulateKeyResponse {
  // KEM ciphertext (encapsulated shared secret).
  //
  // ALGORITHM RESOLUTION: The KEM algorithm is NOT carried in this response
  // by design (metadata is unauthenticated — see metadata.proto threat model).
  // The decapsulator resolves the algorithm from its own private key's
  // template (ReadKey => key_metadata.template_id). The ciphertext byte
  // encoding is documented by metadata.provider_output.encoding ("raw" is
  // the FIPS 203 native encoding for ML-KEM). Relay the metadata alongside
  // the ciphertext to the decapsulating party.
  bytes ciphertext = 1;
  OperationMetadata metadata = 2;
  // Metadata of the newly created shared secret key.
  // Consistent with CreateKeyResponse, ImportKeyResponse, TransformKeyResponse.
  KeyMetadata key_metadata = 3;
}

message DecapsulateKeyRequest {
  string private_key_name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
  bytes ciphertext = 2;
  string shared_secret_name = 3 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
  string shared_secret_template_id = 4;
  // Operation metadata relayed from the encapsulate response.
  // Contains provider_output (ciphertext encoding) and api_version.
  OperationMetadata metadata = 5;
  
  // Optional: User-provided context for audit trail enrichment.
  map<string, string> user_context = 15;
}

message DecapsulateKeyResponse {
  bool success = 1;
  OperationMetadata metadata = 2;
  // Metadata of the newly created shared secret key.
  // Consistent with CreateKeyResponse, ImportKeyResponse, TransformKeyResponse.
  KeyMetadata key_metadata = 3;
}
