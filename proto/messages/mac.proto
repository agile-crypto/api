syntax = "proto3";

package caas.crypto.v1;

option go_package = "github.ibm.com/citius/api/gen/go/messages;messages";

import "messages/metadata.proto";
import "types/operation_params.proto";
import "buf/validate/validate.proto";

// ============================================================================
// MAC (Message Authentication Code) Operations
// ============================================================================

message GenerateMACRequest {
  string key_name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
  bytes message = 2;
  
  // Scope-based operation parameters.
  // REQUIRED: Always set one option to make intent explicit.
  oneof scope_params {
    option (buf.validate.oneof).required = true;
    NoParams no_params = 3;                        // Standard MACs (HMAC, CMAC, Poly1305)
    CustomizableMacParams customizable_params = 4; // Customizable MACs (KMAC)
    VendorMacParams vendor_params = 5;             // Vendor/custom scope
  }
  
  // Optional: User-provided context for audit trail enrichment.
  map<string, string> user_context = 15;
}

message GenerateMACResponse {
  bytes mac = 1;
  OperationMetadata metadata = 2;
}

message VerifyMACRequest {
  string key_name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
  bytes message = 2;
  bytes mac = 3;
  // Operation metadata from generate MAC response.
  // Contains key_version to ensure correct key is used for verification.
  OperationMetadata metadata = 4;
  
  // Must match scope used during MAC generation.
  oneof scope_params {
    option (buf.validate.oneof).required = true;
    NoParams no_params = 5;                        // Standard MACs
    CustomizableMacParams customizable_params = 6; // Customizable MACs (KMAC)
    VendorMacParams vendor_params = 7;             // Vendor/custom scope
  }
  
  // Optional: User-provided context for audit trail enrichment.
  map<string, string> user_context = 15;
}

message VerifyMACResponse {
  // Result of MAC comparison. Implementations MUST use a constant-time
  // comparison (e.g., crypto/subtle ConstantTimeCompare) to avoid timing
  // side channels that would let an attacker forge MACs byte-by-byte.
  bool valid = 1;
  OperationMetadata metadata = 2;
}

// ============================================================================
// Streaming MAC Operations (MAC_SCOPE_STREAMING)
// ============================================================================
// Multi-part MAC generation/verification for data that doesn't fit in memory.
// PKCS#11 analogy: C_SignInit/C_SignUpdate/C_SignFinal and
// C_VerifyInit/C_VerifyUpdate/C_VerifyFinal with a MAC mechanism
// (CKM_SHA256_HMAC, CKM_AES_CMAC, ...).
// Operation IDs are server-generated and returned by the Init response.

message GenerateMACInitRequest {
  string key_name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];

  // Scope-based operation parameters (same options as GenerateMACRequest).
  oneof scope_params {
    option (buf.validate.oneof).required = true;
    NoParams no_params = 2;                        // Standard MACs (HMAC, CMAC, Poly1305)
    CustomizableMacParams customizable_params = 3; // Customizable MACs (KMAC)
    VendorMacParams vendor_params = 4;             // Vendor/custom scope
  }

  // Optional: User-provided context for audit trail enrichment.
  map<string, string> user_context = 15;
}

message GenerateMACInitResponse {
  bool success = 1;
  // Server-generated unique identifier for this streaming session.
  // Pass this operation_id to all subsequent calls of the session.
  string operation_id = 2;
}

message GenerateMACUpdateRequest {
  string operation_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
  bytes data_chunk = 2;
}

message GenerateMACUpdateResponse {
  bool success = 1;
}

message GenerateMACFinalRequest {
  string operation_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
}

message GenerateMACFinalResponse {
  bytes mac = 1;
  OperationMetadata metadata = 2;
}

message VerifyMACInitRequest {
  string key_name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];

  // Must match scope used during MAC generation.
  oneof scope_params {
    option (buf.validate.oneof).required = true;
    NoParams no_params = 2;                        // Standard MACs
    CustomizableMacParams customizable_params = 3; // Customizable MACs (KMAC)
    VendorMacParams vendor_params = 4;             // Vendor/custom scope
  }

  // Operation metadata from the corresponding generate MAC response.
  // Contains key_version so verification uses the same key version that
  // produced the MAC (critical after key rotation).
  OperationMetadata metadata = 5;

  // Optional: User-provided context for audit trail enrichment.
  map<string, string> user_context = 15;
}

message VerifyMACInitResponse {
  bool success = 1;
  // Server-generated unique identifier for this streaming session.
  // Pass this operation_id to all subsequent calls of the session.
  string operation_id = 2;
}

message VerifyMACUpdateRequest {
  string operation_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
  bytes data_chunk = 2;
}

message VerifyMACUpdateResponse {
  bool success = 1;
}

message VerifyMACFinalRequest {
  string operation_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
  bytes mac = 2;
}

message VerifyMACFinalResponse {
  // Result of MAC comparison. Implementations MUST use a constant-time
  // comparison to avoid timing side channels.
  bool valid = 1;
  OperationMetadata metadata = 2;
}
