syntax = "proto3";

package caas.crypto.v1;

option go_package = "github.com/agile-crypto/citius-api-go/gen/go/services;services";

import "google/api/annotations.proto";
import "types/common.proto";
import "types/templates.proto";

// ============================================================================
// Algorithm Discovery Service
// ============================================================================
//
// SCOPE-BASED DISCOVERY MECHANISM:
//
// Templates are discovered via typed ScopeSpecification filtering. Clients specify
// the cryptographic primitive and its requirements; the service returns matching
// templates. Additional filters narrow results by lifecycle status and standards
// compliance.
//
// DISCOVERY PATTERNS:
//
// The API uses typed ScopeSpecification (per-primitive scope enums) for filtering,
// NOT a flat CRYPTO_SCOPE_* enum. See types/common.proto for ScopeSpecification.
//
// Pattern 1: Find AEAD templates with 256-bit security
//   ListTemplatesRequest {
//     scope_spec: {
//       aead: { scope: AEAD_SCOPE_STANDARD, security: { security_strength_bits: 256 } }
//     }
//   }
//   → Returns all AEAD templates with 256-bit keys
//
// Pattern 2: Find FIPS-approved signature templates
//   ListTemplatesRequest {
//     scope_spec: {
//       signature: { scope: SIGNATURE_SCOPE_STANDARD, security: { fips_approved: true, security_strength_bits: 256 } }
//     }
//     allowed_statuses: [TEMPLATE_STATUS_ACTIVE]
//   }
//   → Returns only FIPS-approved, active signature templates with 256-bit strength
//
// Pattern 3: Find post-quantum signature options
//   ListTemplatesRequest {
//     scope_spec: {
//       signature: { scope: SIGNATURE_SCOPE_STANDARD, security: { quantum_safe: true } }
//     }
//   }
//   → Returns ML-DSA, SLH-DSA, and other post-quantum signature templates
//
// Pattern 4: Find templates compliant with specific standards
//   ListTemplatesRequest {
//     scope_spec: {
//       kdf: { scope: KDF_SCOPE_PASSWORD }
//     }
//     required_standards: ["NIST SP 800-132"]
//   }
//   → Returns KDFs referencing NIST SP 800-132
//

service AlgorithmDiscoveryService {
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse) {
    option (google.api.http) = {
      get: "/v1/templates"
    };
  }

  rpc GetTemplate(GetTemplateRequest) returns (GetTemplateResponse) {
    option (google.api.http) = {
      get: "/v1/templates/{template_id}"
    };
  }

  rpc ListScopes(ListScopesRequest) returns (ListScopesResponse) {
    option (google.api.http) = {
      get: "/v1/scopes"
    };
  }
}

message ListTemplatesRequest {
  // Filter by scope specification (optional)
  // Example: { aead: { scope: AEAD_SCOPE_STANDARD, security: { security_strength_bits: 256 } } }
  ScopeSpecification scope_spec = 1;
  
  // Filter by lifecycle status (e.g., only ACTIVE and ACCEPTABLE). Optional.
  // If empty, all statuses are returned.
  repeated TemplateStatus allowed_statuses = 2;
  
  // Filter by required standards compliance (e.g., ["FIPS 197", "NIST SP 800-38D"]). Optional.
  // Templates must reference ALL specified standards.
  repeated string required_standards = 3;

  // Pagination
  int32 page_size = 10;   // Max results per page (0 = server default = return all)
  string page_token = 11; // Opaque token from previous ListTemplatesResponse
}

message ListTemplatesResponse {
  repeated TemplateInfo templates = 1;
  // Opaque token for the next page. Empty if no more results.
  string next_page_token = 2;
}

message GetTemplateRequest {
  string template_id = 1;
}

message GetTemplateResponse {
  TemplateInfo template = 1;
}

message ListScopesRequest {}

message ListScopesResponse {
  repeated ScopeInfo scopes = 1;
}
